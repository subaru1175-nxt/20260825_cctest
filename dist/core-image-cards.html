<script>
/*
 * storage.js — 保存・読み込み・書き出し・データの整形
 *
 * 保存先（backend）は差し替えられる：
 *   - local  : ブラウザの localStorage（通常はこれ）
 *   - memory : 保存できない環境での一時保存（再読み込みで消える → 画面で警告）
 *   - その他 : window.CIF.extraBackend が用意されていればそれを優先（公開ページ版など）
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('./util.js'));
  } else {
    root.CIF = root.CIF || {};
    root.CIF.storage = factory(root.CIF.util);
  }
})(this, function (util) {
  'use strict';

  const PREFIX = 'cif.v1.';
  const KEYS = ['words', 'progress', 'log', 'settings', 'session', 'meta', 'rounds', 'tests'];
  const FORMAT = 'core-image-flashcards';
  const FORMAT_VERSION = 1;

  const STATUS = {
    verified: { key: 'verified', label: '確認済み', desc: '辞書などで確認した内容。出典を記録しています。' },
    unverified: { key: 'unverified', label: '未確認', desc: '自分で入力した内容など。出題はしますが、辞書での確認はまだです。' },
    needs_review: { key: 'needs_review', label: '要確認', desc: '読めない文字や意図が不明な点があるため、通常の出題から外しています。' },
  };

  const POS = {
    noun: '名詞', verb: '動詞', adjective: '形容詞', adverb: '副詞',
    preposition: '前置詞', interjection: '間投詞', conjunction: '接続詞', pronoun: '代名詞',
    auxiliary: '助動詞', phrase: 'フレーズ', other: 'その他',
  };

  const ROLE = {
    thing: 'もの・こと', action: '動き', state: '状態', change: '変化（〜になる）',
    quality: 'どんな（様子）', manner: 'どんなふうに', degree: 'どのくらい',
    relation: '位置・関係', connector: '気持ち・話のつなぎ',
    person: '人', amount: '数・量', place: '場所・方角', time: '時・回数', addition: '付け加え（〜も）',
    mood: '話し手の気持ち',
  };

  const GROUPS = ['A', 'B', 'C', 'D'];

  const DEFAULT_SETTINGS = {
    voiceURI: '',
    rate: 0.95,
    slowRate: 0.55,
    slowGap: 300,
    slowWordByWord: true,
    dailyGoal: 10,
    accent: 'us',
    autoplay: false,
    studyMode: 'fwd',
  };

  /* ---------- 保存先 ---------- */

  function localBackend(storage) {
    const ls = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    // 書き込めるか試す（プライベートモード等で例外になることがある）
    ls.setItem(PREFIX + '_probe', '1');
    ls.removeItem(PREFIX + '_probe');
    return {
      name: 'local',
      persistent: true,
      async load(key) {
        const raw = ls.getItem(PREFIX + key);
        return raw == null ? undefined : JSON.parse(raw);
      },
      async save(key, value) {
        if (value === undefined || value === null) ls.removeItem(PREFIX + key);
        else ls.setItem(PREFIX + key, JSON.stringify(value));
      },
      saveSync(key, value) {
        if (value === undefined || value === null) ls.removeItem(PREFIX + key);
        else ls.setItem(PREFIX + key, JSON.stringify(value));
      },
    };
  }

  function memoryBackend() {
    const mem = {};
    return {
      name: 'memory',
      persistent: false,
      async load(key) {
        return mem[key] === undefined ? undefined : util.clone(mem[key]);
      },
      async save(key, value) {
        mem[key] = util.clone(value);
      },
    };
  }

  async function pickBackend() {
    const g = typeof window !== 'undefined' ? window : {};
    if (g.CIF && typeof g.CIF.extraBackend === 'function') {
      try {
        const b = await g.CIF.extraBackend();
        if (b) return b;
      } catch (e) {
        /* 使えなければ localStorage へ */
      }
    }
    try {
      return localBackend();
    } catch (e) {
      return memoryBackend();
    }
  }

  /* ---------- ストア（画面からはこれを使う） ---------- */

  function createStore(backend) {
    const state = { words: [], progress: {}, log: null, settings: null, session: null, meta: {}, rounds: [], tests: null };
    const status = { backend: backend.name, persistent: backend.persistent, error: '' };
    const pending = {};
    const writing = {};
    const listeners = [];

    function notify() {
      listeners.forEach((fn) => {
        try { fn(status); } catch (e) { /* noop */ }
      });
    }

    async function flush(key) {
      if (writing[key]) return;
      writing[key] = true;
      try {
        while (Object.prototype.hasOwnProperty.call(pending, key)) {
          const value = pending[key];
          delete pending[key];
          await backend.save(key, value);
        }
        if (status.error) {
          status.error = '';
          notify();
        }
      } catch (e) {
        status.error = saveErrorMessage(e);
        notify();
      } finally {
        writing[key] = false;
      }
    }

    function persist(key) {
      const value = state[key];
      if (backend.saveSync) {
        try {
          backend.saveSync(key, value);
          if (status.error) {
            status.error = '';
            notify();
          }
        } catch (e) {
          status.error = saveErrorMessage(e);
          notify();
        }
        return Promise.resolve();
      }
      pending[key] = util.clone(value);
      return flush(key);
    }

    return {
      state,
      status,
      onStatus(fn) { listeners.push(fn); },
      async init(seed) {
        const loaded = {};
        for (const key of KEYS) {
          try {
            loaded[key] = await backend.load(key);
          } catch (e) {
            loaded[key] = undefined;
            status.error = '保存データの一部を読み込めませんでした（' + key + '）。';
          }
        }
        const meta = loaded.meta && typeof loaded.meta === 'object' ? loaded.meta : {};
        let words;
        if (Array.isArray(loaded.words)) {
          words = loaded.words.map((w) => normalizeWord(w).word).filter(Boolean);
          const merged = mergeNewSeedWords(words, seed, meta);
          words = merged.words;
          if (merged.added) loaded._wordsChanged = true;
        } else {
          words = (seed ? seed.words : []).map((w) => normalizeWord(w).word);
          meta.seedVersion = seed ? seed.version : 0;
          loaded._wordsChanged = true;
        }
        state.words = words;
        state.progress = normalizeProgress(loaded.progress);
        state.log = normalizeLog(loaded.log);
        state.settings = normalizeSettings(loaded.settings);
        state.session = loaded.session && typeof loaded.session === 'object' ? loaded.session : null;
        state.meta = Object.assign({ deletedSeed: [] }, meta, { seedVersion: seed ? seed.version : meta.seedVersion || 0 });
        const rounds = mergeRounds(normalizeRounds(loaded.rounds), seed && seed.rounds, new Set(words.map((w) => w.id)));
        state.rounds = rounds.rounds;
        state.tests = normalizeTests(loaded.tests);
        if (loaded._wordsChanged) {
          persist('words');
          persist('meta');
        }
        if (rounds.changed) persist('rounds');
        return state;
      },
      set(key, value) {
        if (!KEYS.includes(key)) throw new Error('unknown key ' + key);
        state[key] = value;
        return persist(key);
      },
      setMany(obj) {
        return Promise.all(Object.keys(obj).map((k) => this.set(k, obj[k])));
      },
    };
  }

  function saveErrorMessage(e) {
    const name = e && (e.name || e.code);
    if (name === 'QuotaExceededError' || name === 'quota_exceeded' || name === 'NS_ERROR_DOM_QUOTA_REACHED') {
      return '保存できる容量がいっぱいです。不要な単語を削除するか、データを書き出してください。';
    }
    return '学習データを保存できませんでした。ブラウザの設定（プライベートモードなど）を確認してください。';
  }

  /**
   * 新しいバージョンの初期データを反映する
   *  - 増えた初期単語を追加（ユーザーが削除したものは戻さない）
   *  - 自分で編集していない初期単語は、新しい版の内容に入れかえる（直したところを届ける。学習記録は用法IDのままなので残る）
   */
  function mergeNewSeedWords(words, seed, meta) {
    if (!seed || !(seed.version > (meta.seedVersion || 0))) return { words, added: 0 };
    const fresh = new Map(seed.words.map((w) => [w.id, w]));
    let refreshed = 0;
    words = words.map((w) => {
      const s = fresh.get(w.id);
      if (!s || w.updatedAt) return w;
      const nw = normalizeWord(s).word;
      if (JSON.stringify(nw) !== JSON.stringify(w)) refreshed += 1;
      return nw;
    });
    const have = new Set(words.map((w) => w.id));
    const deleted = new Set(meta.deletedSeed || []);
    const add = seed.words.filter((w) => !have.has(w.id) && !deleted.has(w.id)).map((w) => normalizeWord(w).word);
    // 初期データの単語は新しい版の並び順にそろえる（新しい単語から出題されるように）。自分で追加した単語はそのあと。
    const order = new Map(seed.words.map((w, i) => [w.id, i]));
    const merged = words.concat(add).map((w, i) => ({ w, k: order.has(w.id) ? order.get(w.id) : seed.words.length + i }));
    merged.sort((a, b) => a.k - b.k);
    return { words: merged.map((x) => x.w), added: add.length + refreshed };
  }

  /* ---------- データの整形・チェック ---------- */

  const MAX_TEXT = 2000;
  const REPLACEMENT = /\uFFFD/;
  const HEADWORD_OK = /^[A-Za-z][A-Za-z '’.\-]*$/;

  function str(v, max) {
    if (v == null) return '';
    const s = typeof v === 'string' ? v : typeof v === 'number' ? String(v) : '';
    return s.trim().slice(0, max || MAX_TEXT);
  }

  function safeUrl(v) {
    const s = str(v, 500);
    if (!s) return '';
    if (/^https?:\/\//i.test(s)) return s;
    // 同じフォルダの録音ファイル（audio/xxx.mp3 など）も許可
    if (/^[\w\-./]+\.(mp3|m4a|aac|wav|ogg|oga|webm)$/i.test(s) && !s.includes('..')) return s;
    return '';
  }

  function safeId(v, prefix, fallbackText) {
    const s = str(v, 64);
    if (/^[A-Za-z0-9][A-Za-z0-9-]*$/.test(s)) return s;
    return util.randomId(prefix + '-' + util.slug(fallbackText));
  }

  function hasBrokenText(obj) {
    return REPLACEMENT.test(JSON.stringify(obj || ''));
  }

  /**
   * 単語データを安全な形にそろえる。
   * 見出し語が英字でない・文字化けがある・意味が空 などは「要確認」にして理由を残す。
   */
  function normalizeWord(raw) {
    if (!raw || typeof raw !== 'object') return { word: null, problems: ['データの形が正しくありません'] };
    const problems = [];
    const headword = str(raw.headword, 60);
    const w = {
      id: safeId(raw.id, 'w', headword),
      headword,
      status: STATUS[raw.status] ? raw.status : 'unverified',
      check: {
        date: str(raw.check && raw.check.date, 20),
        method: str(raw.check && raw.check.method),
        note: str(raw.check && raw.check.note),
      },
      sources: Array.isArray(raw.sources)
        ? raw.sources
            .map((s) => ({ label: str(s && s.label, 200), url: safeUrl(s && s.url) }))
            .filter((s) => s.label || s.url)
            .slice(0, 10)
        : [],
      groups: {},
      senses: [],
      reviewReasons: [],
      createdAt: Number(raw.createdAt) || 0,
      updatedAt: Number(raw.updatedAt) || 0,
    };
    if (raw.groups && typeof raw.groups === 'object') {
      GROUPS.forEach((g) => {
        const t = str(raw.groups[g], 300);
        if (t) w.groups[g] = t;
      });
    }
    const seenIds = new Set();
    (Array.isArray(raw.senses) ? raw.senses : []).slice(0, 12).forEach((s) => {
      const sense = normalizeSense(s, headword);
      if (!sense) return;
      if (seenIds.has(sense.id)) sense.id = util.randomId('s-' + util.slug(headword));
      seenIds.add(sense.id);
      w.senses.push(sense);
    });

    if (!headword) problems.push('見出し語がありません');
    else if (REPLACEMENT.test(headword)) problems.push('見出し語に読めない文字（\uFFFD）があります');
    else if (!HEADWORD_OK.test(headword)) problems.push('見出し語に英字以外の文字が含まれています');
    if (!w.senses.length) problems.push('意味・用法が登録されていません');
    if (hasBrokenText(raw.senses)) problems.push('説明や例文に読めない文字（\uFFFD）があります');
    if (problems.length) {
      w.status = 'needs_review';
      w.reviewReasons = problems;
    } else if (Array.isArray(raw.reviewReasons) && raw.status === 'needs_review') {
      w.reviewReasons = raw.reviewReasons.map((r) => str(r, 200)).filter(Boolean).slice(0, 5);
    }
    return { word: w, problems };
  }

  function normalizeSense(s, headword) {
    if (!s || typeof s !== 'object') return null;
    const sense = {
      test: normalizeTestSentence(s.test),
      id: safeId(s.id, 's', headword),
      group: GROUPS.includes(s.group) ? s.group : 'A',
      pos: POS[s.pos] ? s.pos : 'other',
      role: ROLE[s.role] ? s.role : '',
      cue: str(s.cue, 120),
      speak: str(s.speak, 120),
      ipa: { us: str(s.ipa && s.ipa.us, 60), uk: str(s.ipa && s.ipa.uk, 60) },
      stress: str(s.stress, 60),
      nuance: str(s.nuance, 200),
      scene: {
        emoji: str(s.scene && s.scene.emoji, 16),
        diagram: str(s.scene && s.scene.diagram, 40),
        text: str(s.scene && s.scene.text, 300),
      },
      meaning: str(s.meaning, 200),
      roleText: str(s.roleText, 600),
      examples: (Array.isArray(s.examples) ? s.examples : [])
        .map((e) => ({ en: str(e && e.en, 300), ja: str(e && e.ja, 300) }))
        .filter((e) => e.en)
        .slice(0, 6),
      contrasts: (Array.isArray(s.contrasts) ? s.contrasts : [])
        .map((c) => ({ word: str(c && c.word, 60), text: str(c && c.text, 400) }))
        .filter((c) => c.word || c.text)
        .slice(0, 6),
      note: str(s.note, 600),
      status: s.status === 'needs_review' ? 'needs_review' : '',
      audio: {
        word: safeUrl(s.audio && s.audio.word),
        examples: (s.audio && Array.isArray(s.audio.examples) ? s.audio.examples : []).map(safeUrl).slice(0, 6),
      },
    };
    if (!sense.meaning) sense.status = 'needs_review';
    return sense;
  }

  function num(v, d) {
    const n = Number(v);
    return Number.isFinite(n) ? n : d;
  }

  function normalizeState(st) {
    if (!st || typeof st !== 'object') return null;
    return {
      reps: Math.max(0, Math.floor(num(st.reps, 0))),
      lapses: Math.max(0, Math.floor(num(st.lapses, 0))),
      streak: Math.max(0, Math.floor(num(st.streak, 0))),
      interval: Math.max(0, Math.min(365, Math.floor(num(st.interval, 0)))),
      ease: Math.max(1.3, Math.min(3.5, num(st.ease, 2.5))),
      due: Math.max(0, num(st.due, 0)),
      last: Math.max(0, num(st.last, 0)),
      history: (Array.isArray(st.history) ? st.history : [])
        .filter((h) => h && ['again', 'hard', 'good'].includes(h.r))
        .map((h) => {
          const e = { t: num(h.t, 0), r: h.r };
          if (h.re) e.re = true;
          if (h.ivl != null) e.ivl = num(h.ivl, 0);
          return e;
        })
        .slice(-40),
    };
  }

  function normalizeProgress(p) {
    const out = {};
    if (!p || typeof p !== 'object') return out;
    Object.keys(p).forEach((id) => {
      if (!/^[A-Za-z0-9][A-Za-z0-9-]*$/.test(id)) return;
      const e = p[id] || {};
      const fwd = normalizeState(e.fwd);
      const rev = normalizeState(e.rev);
      if (fwd || rev) {
        out[id] = {};
        if (fwd) out[id].fwd = fwd;
        if (rev) out[id].rev = rev;
      }
    });
    return out;
  }

  function normalizeLog(l) {
    const out = { days: {}, totalPoints: 0 };
    if (!l || typeof l !== 'object') return out;
    out.totalPoints = Math.max(0, Math.floor(num(l.totalPoints, 0)));
    const days = l.days && typeof l.days === 'object' ? l.days : {};
    Object.keys(days).forEach((k) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const d = days[k] || {};
      out.days[k] = {
        cards: Math.max(0, Math.floor(num(d.cards, 0))),
        answers: Math.max(0, Math.floor(num(d.answers, 0))),
        good: Math.max(0, Math.floor(num(d.good, 0))),
        hard: Math.max(0, Math.floor(num(d.hard, 0))),
        again: Math.max(0, Math.floor(num(d.again, 0))),
        points: Math.max(0, Math.floor(num(d.points, 0))),
        sets: Math.max(0, Math.floor(num(d.sets, 0))),
        goalReached: !!d.goalReached,
      };
    });
    return out;
  }

  function normalizeTestSentence(t) {
    if (!t || typeof t !== 'object') return null;
    const en = str(t.en, 300);
    if (!en) return null;
    return {
      en,
      ja: str(t.ja, 300),
      alts: (Array.isArray(t.alts) ? t.alts : []).map((a) => str(a, 300)).filter(Boolean).slice(0, 6),
    };
  }

  /* ---------- 回（第1回・第2回…） ---------- */

  function normalizeRounds(list) {
    if (!Array.isArray(list)) return [];
    const seen = new Set();
    return list
      .filter((r) => r && typeof r === 'object' && /^[A-Za-z0-9-]+$/.test(String(r.id || '')))
      .filter((r) => !seen.has(r.id) && seen.add(r.id))
      .map((r) => ({
        id: String(r.id),
        no: Math.max(1, Math.floor(num(r.no, 1))),
        title: str(r.title, 40) || '第' + Math.max(1, Math.floor(num(r.no, 1))) + '回',
        source: str(r.source, 200),
        addedAt: str(r.addedAt, 20),
        wordIds: (Array.isArray(r.wordIds) ? r.wordIds : []).map((x) => str(x, 64)).filter((x) => /^[A-Za-z0-9][A-Za-z0-9-]*$/.test(x)),
      }))
      .sort((a, b) => a.no - b.no);
  }

  /** 初期データの回を足す。すでにある回には、新しく増えた単語だけを足す（自分で入れた単語は残す） */
  function mergeRounds(rounds, seedRounds, wordIds) {
    let changed = false;
    const out = rounds.map((r) => Object.assign({}, r, { wordIds: r.wordIds.slice() }));
    normalizeRounds(seedRounds || []).forEach((sr) => {
      const cur = out.find((r) => r.id === sr.id);
      if (!cur) {
        out.push(sr);
        changed = true;
        return;
      }
      const have = new Set(cur.wordIds);
      const add = sr.wordIds.filter((id) => !have.has(id));
      if (add.length) {
        cur.wordIds = sr.wordIds.concat(cur.wordIds.filter((id) => !sr.wordIds.includes(id)));
        changed = true;
      }
    });
    out.forEach((r) => {
      const before = r.wordIds.length;
      r.wordIds = r.wordIds.filter((id) => wordIds.has(id));
      if (r.wordIds.length !== before) changed = true;
    });
    out.sort((a, b) => a.no - b.no);
    return { rounds: out, changed };
  }

  /* ---------- テストの記録 ---------- */

  const PARTS = ['understand', 'compose'];

  function emptyTests() {
    return { attempts: [], current: null, misses: {} };
  }

  function normalizeTests(t) {
    const out = emptyTests();
    if (!t || typeof t !== 'object') return out;
    const part = (p) => ({
      correct: Math.max(0, Math.floor(num(p && p.correct, 0))),
      total: Math.max(0, Math.floor(num(p && p.total, 0))),
    });
    out.attempts = (Array.isArray(t.attempts) ? t.attempts : []).slice(-500).filter((a) => a && typeof a === 'object').map((a) => ({
      id: str(a.id, 40),
      kind: a.kind === 'review' ? 'review' : 'round',
      roundId: str(a.roundId, 40),
      no: Math.max(0, Math.floor(num(a.no, 0))),
      startedAt: num(a.startedAt, 0),
      finishedAt: num(a.finishedAt, 0),
      score: Math.max(0, Math.min(100, Math.floor(num(a.score, 0)))),
      parts: { understand: part(a.parts && a.parts.understand), compose: part(a.parts && a.parts.compose) },
      wrongs: (Array.isArray(a.wrongs) ? a.wrongs : []).slice(0, 400).map((w) => ({
        senseId: str(w && w.senseId, 64),
        part: PARTS.includes(w && w.part) ? w.part : 'understand',
        qtype: str(w && w.qtype, 20),
        given: str(w && w.given, 300),
        answer: str(w && w.answer, 300),
      })).filter((w) => w.senseId),
    }));
    if (t.current && typeof t.current === 'object' && Array.isArray(t.current.questions) && Array.isArray(t.current.results)) out.current = t.current;
    const m = t.misses && typeof t.misses === 'object' ? t.misses : {};
    Object.keys(m).forEach((k) => {
      const e = m[k];
      if (!e || !/^[A-Za-z0-9][A-Za-z0-9-]*\|(understand|compose)$/.test(k)) return;
      out.misses[k] = {
        senseId: str(e.senseId, 64),
        part: PARTS.includes(e.part) ? e.part : 'understand',
        roundIds: (Array.isArray(e.roundIds) ? e.roundIds : []).map((x) => str(x, 40)).filter(Boolean),
        count: Math.max(1, Math.floor(num(e.count, 1))),
        firstAt: num(e.firstAt, 0),
        lastAt: num(e.lastAt, 0),
        solvedAt: e.solvedAt ? num(e.solvedAt, 0) : 0,
        last: e.last && typeof e.last === 'object'
          ? { qtype: str(e.last.qtype, 20), given: str(e.last.given, 300), answer: str(e.last.answer, 300) }
          : { qtype: '', given: '', answer: '' },
      };
    });
    return out;
  }

  function normalizeSettings(s) {
    const out = Object.assign({}, DEFAULT_SETTINGS);
    if (!s || typeof s !== 'object') return out;
    out.voiceURI = str(s.voiceURI, 300);
    out.rate = Math.max(0.5, Math.min(1.3, num(s.rate, DEFAULT_SETTINGS.rate)));
    out.slowRate = Math.max(0.3, Math.min(1, num(s.slowRate, DEFAULT_SETTINGS.slowRate)));
    out.slowGap = Math.max(0, Math.min(1200, Math.round(num(s.slowGap, DEFAULT_SETTINGS.slowGap))));
    out.slowWordByWord = s.slowWordByWord !== false;
    out.dailyGoal = [10, 20, 30, 40].includes(Number(s.dailyGoal)) ? Number(s.dailyGoal) : DEFAULT_SETTINGS.dailyGoal;
    out.accent = s.accent === 'uk' ? 'uk' : 'us';
    out.autoplay = !!s.autoplay;
    out.studyMode = s.studyMode === 'rev' ? 'rev' : 'fwd';
    return out;
  }

  /* ---------- 書き出し・読み込み ---------- */

  function buildExport(state, opts) {
    const includeProgress = !opts || opts.includeProgress !== false;
    const data = {
      format: FORMAT,
      version: FORMAT_VERSION,
      exportedAt: new Date().toISOString(),
      words: state.words,
      rounds: state.rounds || [],
    };
    if (includeProgress) {
      data.progress = state.progress;
      data.log = state.log;
      data.settings = state.settings;
      data.tests = Object.assign({}, state.tests || emptyTests(), { current: null });
    }
    return data;
  }

  function exportFileName(now) {
    return 'core-image-cards-' + util.dayKey(now || Date.now()).replace(/-/g, '') + '.json';
  }

  /**
   * 読み込むテキストを確認する。
   * 戻り値: { ok, error?, data?, stats?, warnings? }
   */
  function parseImport(text) {
    let json;
    try {
      json = JSON.parse(String(text || '').replace(/^\uFEFF/, ''));
    } catch (e) {
      return { ok: false, error: 'JSON として読み込めませんでした。書き出したファイルをそのまま選んでください。' };
    }
    let rawWords;
    if (Array.isArray(json)) rawWords = json;
    else if (json && Array.isArray(json.words)) rawWords = json.words;
    else return { ok: false, error: '単語データ（words）が見つかりません。' };
    if (json && json.format && json.format !== FORMAT) {
      return { ok: false, error: 'このアプリのデータ形式ではありません（format: ' + str(json.format, 40) + '）。' };
    }
    const warnings = [];
    const words = [];
    const ids = new Set();
    rawWords.slice(0, 2000).forEach((raw, i) => {
      const { word, problems } = normalizeWord(raw);
      if (!word) {
        warnings.push((i + 1) + '件目: 形式が正しくないため読み飛ばしました');
        return;
      }
      if (ids.has(word.id)) word.id = util.randomId('w-' + util.slug(word.headword));
      ids.add(word.id);
      if (problems.length) warnings.push('「' + (word.headword || (i + 1) + '件目') + '」は要確認にしました: ' + problems.join('、'));
      words.push(word);
    });
    const hasProgress = !!(json && !Array.isArray(json) && json.progress);
    const data = {
      words,
      progress: hasProgress ? normalizeProgress(json.progress) : null,
      log: json && json.log ? normalizeLog(json.log) : null,
      settings: json && json.settings ? normalizeSettings(json.settings) : null,
      rounds: json && Array.isArray(json.rounds) ? normalizeRounds(json.rounds) : null,
      tests: json && json.tests ? normalizeTests(json.tests) : null,
    };
    const stats = {
      words: words.length,
      senses: words.reduce((n, w) => n + w.senses.length, 0),
      needsReview: words.filter((w) => w.status === 'needs_review').length,
      progress: data.progress ? Object.keys(data.progress).length : 0,
      days: data.log ? Object.keys(data.log.days).length : 0,
      rounds: data.rounds ? data.rounds.length : 0,
      attempts: data.tests ? data.tests.attempts.length : 0,
    };
    return { ok: true, data, stats, warnings };
  }

  /**
   * mode: 'merge'（同じIDは更新・新しい単語は追加。学習記録は今のものを残す）
   *       'replace'（ファイルの内容に置き換える）
   */
  function applyImport(state, data, mode) {
    if (mode === 'replace') {
      const ids = new Set(data.words.map((w) => w.id));
      return {
        words: data.words,
        progress: data.progress || {},
        log: data.log || { days: {}, totalPoints: 0 },
        settings: data.settings || state.settings,
        session: null,
        rounds: mergeRounds(data.rounds || [], [], ids).rounds,
        tests: data.tests || emptyTests(),
      };
    }
    const byId = new Map(state.words.map((w) => [w.id, w]));
    data.words.forEach((w) => byId.set(w.id, w));
    const words = Array.from(byId.values());
    const progress = Object.assign({}, state.progress);
    if (data.progress) {
      Object.keys(data.progress).forEach((id) => {
        if (!progress[id]) progress[id] = data.progress[id];
      });
    }
    const ids = new Set(words.map((w) => w.id));
    const rounds = mergeRounds(state.rounds || [], data.rounds || [], ids).rounds;
    return { words, progress, rounds };
  }

  return {
    PREFIX, KEYS, FORMAT, STATUS, POS, ROLE, GROUPS, DEFAULT_SETTINGS,
    localBackend, memoryBackend, pickBackend, createStore,
    normalizeWord, normalizeSense, normalizeProgress, normalizeLog, normalizeSettings,
    normalizeRounds, mergeRounds, normalizeTests, emptyTests,
    buildExport, exportFileName, parseImport, applyImport, safeUrl,
  };
});

<script>
/*
 * speech.js — 英語音声の再生
 *
 * 音声の種類（画面に表示して区別する）
 *   録音   … 人が読んだ録音ファイル（単語ごとに URL を登録できる）
 *   AI音声 … あらかじめ作った高品質な音声（音声パック js/audio-pack.js。Kokoro・アメリカ英語）
 *   端末   … 端末のブラウザの読み上げ機能（合成音声）
 *
 * 音声パックは単語ごとの1本のファイルに入っている。中身は「1つの英語 × 速さ」ごとに別々に作った MP3 を
 * つないだもので、バイトの範囲で1つを取り出して、それだけを Web Audio で鳴らす（時間の位置は使わない）。
 * （iPhone ではマナーモードでも鳴るように audioSession を playback にする）
 *
 * 端末の読み上げでは、アメリカ英語（en-US）の声を最優先し、その中でも
 * Premium / Enhanced / Natural など高品質な声を選ぶ。
 * 「ゆっくり」は速さを下げたうえで、複数語の文は 1 語ずつ間をあけて読む（細かく聞き取れるように）。
 * 日本語は読み上げない（英語の文字列だけを渡す）。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {

})(this, function () {
  'use strict';

  // 聞き取りにくい・効果音的な声（macOS / iOS の一部）
  const NOVELTY = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Kathy|Princess|Grandma|Grandpa|Rocko|Shelley|Flo|Eddy|Reed|Sandy)\b/i;
  const HIGH = /(premium|enhanced|natural|neural|siri|プレミアム|拡張|google us english)/i;

  const MESSAGES = {
    loading: '音声を準備しています…',
    ready: '',
    'no-english': 'この端末で使える英語の音声が見つかりません。設定の「きれいな発音にするには」を見て、英語（アメリカ）の声を追加してください。',
    unsupported: 'このブラウザは音声の読み上げに対応していません。別のブラウザ（Safari や Chrome）で開くと使えます。',
  };

  function normLang(lang) {
    return String(lang || '').replace('_', '-');
  }

  function isEnglish(v) {
    return /^en(-|$)/i.test(normLang(v.lang));
  }

  function isUS(v) {
    return /^en-us$/i.test(normLang(v.lang));
  }

  function isHighQuality(v) {
    return !!v && (HIGH.test(v.name || '') || HIGH.test(v.voiceURI || '') || /(Microsoft .+ Online)/i.test(v.name || ''));
  }

  function score(v) {
    const name = v.name || '';
    const uri = v.voiceURI || '';
    let s = isUS(v) ? 50 : 10;
    if (/premium|プレミアム/i.test(name + uri)) s += 30;
    else if (/enhanced|拡張/i.test(name + uri)) s += 25;
    if (/(Natural|Neural)/i.test(name) || /Microsoft .+ Online/i.test(name)) s += 25;
    if (/siri/i.test(name + uri)) s += 20;
    if (/Google US English/i.test(name)) s += 18;
    if (/\b(Ava|Samantha|Allison|Susan|Zoe|Evan|Nathan|Tom|Aria|Jenny|Guy|Michelle|Joelle|Noelle)\b/i.test(name)) s += 6;
    if (/compact/i.test(uri)) s -= 5;
    if (NOVELTY.test(name)) s -= 100;
    if (v.default) s += 1;

    return String(text || '').trim().split(/\s+/).filter(Boolean);

      message() {

      canSynth() {

        src.connect(actx.destination);
        src.start(0);
        if (actx.state === 'suspended') actx.resume();

      }

    function loadFile(url) {
      if (files.has(url)) {
        const p = files.get(url);
        files.delete(url);
        files.set(url, p);
        return p;
      }
      const p = win.fetch(url).then((r) => {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.arrayBuffer();
      });
      p.catch(() => files.delete(url));
      files.set(url, p);
      while (files.size > 16) files.delete(files.keys().next().value);
      return p;
    }

    /**
     * 1つの区間（バイトの a〜b）を、音として使える形にする。
     * 区間は、それだけで再生できる MP3 なので、時間の位置に頼らない（となりの音が鳴ることがない）。
     */
    function loadClip(url, a, b) {
      const key = url + '#' + a + '-' + b;
      if (decoded.has(key)) {
        const p = decoded.get(key);
        decoded.delete(key);
        decoded.set(key, p);
        return p;
      }

        if (!(a >= 0 && b > a && b <= ab.byteLength)) throw new Error('range');

      while (decoded.size > 48) decoded.delete(decoded.keys().next().value);

     * 次に使いそうな音を先に読み込む。
     * ボタンを一度押したあと（Web Audio の準備ができたあと）は、区間を音の形にまでしておく。

    function preload(url, a, b) {

        api.packFailed = true;
        cb('error', 'pack');
      };
      if (!win.fetch || !win.Blob || !win.URL || !win.Audio) {
        fail();
        return false;
      }
      loadFile(url).then((ab) => {
        if (my !== token) return;
        if (!(a >= 0 && b > a && b <= ab.byteLength)) throw new Error('range');
        const u = win.URL.createObjectURL(new win.Blob([ab.slice(a, b)], { type: 'audio/mpeg' }));
        const el = new win.Audio(u);
        audioEl = el;
        const done = () => { try { win.URL.revokeObjectURL(u); } catch (e) { /* noop */ } };
        el.onplaying = () => {
          if (my !== token) return;
          announce(url, a, b);
          cb('playing', el.duration);
        };
        el.onended = () => {
          done();
          if (my === token) cb('ended');
        };
        el.onerror = () => {
          done();
          fail();
        };
        const q = el.play();
        if (q && q.catch) q.catch(() => { done(); fail(); });
      }).catch(fail);
      return true;
    }

    function emit() {
      listeners.forEach((fn) => {
        try { fn(api); } catch (e) { /* noop */ }
      });
    }

    function refresh(final) {
      if (!synth || !Utter) return;
      let list = [];
      try { list = synth.getVoices() || []; } catch (e) { list = []; }
      const settings = getSettings() || {};
      const english = list.filter(isEnglish).filter((v) => !NOVELTY.test(v.name || ''));
      english.sort((a, b) => score(b) - score(a));
      api.voices = english;
      const before = api.status + '|' + (api.voice && api.voice.voiceURI);
      if (english.length) {
        api.voice = english.find((v) => v.voiceURI === settings.voiceURI) || english[0];
        api.status = 'ready';
      } else {
        api.voice = null;
        if (final || list.length) api.status = 'no-english';
      }
      if (before !== api.status + '|' + (api.voice && api.voice.voiceURI)) emit();
    }

    function selectVoice(uri) {
      const v = api.voices.find((x) => x.voiceURI === uri);
      if (v) {
        api.voice = v;
        emit();
      }
      return !!v;
    }

    if (synth && Utter) {
      refresh(false);
      try {
        if (synth.addEventListener) synth.addEventListener('voiceschanged', () => refresh(false));
        else synth.onvoiceschanged = () => refresh(false);
      } catch (e) { /* noop */ }
      // voiceschanged が来ないブラウザもあるので数回確認する
      [300, 800, 1600].forEach((ms) => setTimeout(() => refresh(false), ms));
      setTimeout(() => refresh(true), 2600);
    }

    function stop() {
      token += 1;
      clearTimeout(timer);
      if (curSrc) {
        try { curSrc.stop(); } catch (e) { /* noop */ }
        curSrc = null;
      }
      try { if (synth) synth.cancel(); } catch (e) { /* noop */ }
      if (audioEl) {
        try { audioEl.pause(); } catch (e) { /* noop */ }
        audioEl = null;
      }
    }

    /**
     * 端末の読み上げ機能で読む。クリック処理の中から同期的に呼ぶこと（iOS の制限）。
     * cb(state, detail): 'playing' | 'ended' | 'error'
     */
    function speak(text, opts) {
      const o = opts || {};
      const cb = o.onState || function () {};
      if (api.status !== 'ready' || !api.voice) return false;
      stop();
      const my = ++token;
      const settings = getSettings() || {};
      const words = slowChunks(text);
      const byWord = !!o.slow && settings.slowWordByWord !== false && words.length > 1;
      const parts = byWord ? words : [String(text)];
      const slowRate = settings.slowRate || 0.55;
      const rate = o.slow ? (byWord ? slowRate : Math.min(slowRate, 0.5)) : settings.rate || 0.95;
      const gap = settings.slowGap == null ? 300 : settings.slowGap;
      let started = false;
      const watchdog = setTimeout(() => {
        if (!started && my === token) {
          try { synth.cancel(); } catch (e) { /* noop */ }
          cb('error', 'no-start');
        }
      }, 4000);

      function say(i) {
        if (my !== token) return;
        const u = new Utter(parts[i]);
        u.voice = api.voice;
        u.lang = normLang(api.voice.lang) || 'en-US';
        u.rate = rate;
        u.pitch = 1;
        u.onstart = () => {
          if (!started) {
            started = true;
            clearTimeout(watchdog);
            if (my === token) cb('playing');
          }
        };
        u.onend = () => {
          if (my !== token) return;
          if (i + 1 < parts.length) timer = setTimeout(() => say(i + 1), gap);
          else cb('ended');
        };
        u.onerror = (e) => {
          clearTimeout(watchdog);
          if (my !== token) return;
          const code = e && e.error;
          if (code === 'interrupted' || code === 'canceled') cb('ended');
          else cb('error', code || 'error');
        };
        synth.speak(u);
        if (synth.paused) synth.resume();
      }

      try {
        say(0);
      } catch (e) {
        clearTimeout(watchdog);
        cb('error', 'exception');
        return false;
      }
      return true;
    }

    /** 音声ファイル（録音・高品質音声）の再生。slowUrl がなければ再生速度を下げる */
    function play(url, opts) {
      const o = opts || {};
      const cb = o.onState || function () {};
      stop();
      const my = ++token;
      let a;
      try {
        a = new win.Audio(url);
      } catch (e) {
        cb('error', 'audio');
        return false;
      }
      audioEl = a;
      try {
        a.preservesPitch = true;
        a.playbackRate = o.slow && !o.isSlowFile ? 0.7 : 1;
      } catch (e) { /* noop */ }
      a.onplaying = () => my === token && cb('playing');
      a.onended = () => my === token && cb('ended');
      a.onerror = () => my === token && cb('error', 'audio');
      const p = a.play();
      if (p && p.catch) p.catch(() => my === token && cb('error', 'audio'));
      return true;
    }

    function voiceLabel(v) {
      if (!v) return '';
      const tags = [];
      if (isUS(v)) tags.push('アメリカ英語');
      else tags.push(normLang(v.lang));
      if (isHighQuality(v)) tags.push('高品質');
      if (v.localService === false) tags.push('オンライン');
      return v.name + '（' + tags.join('・') + '）';
    }

    function currentLabel() {
      return api.voice ? voiceLabel(api.voice) : '';
    }

    return api;
  }

  return { create, score, isEnglish, isUS, isHighQuality, slowChunks, MESSAGES };
});

</script>
<script>
/*
 * app.js — 画面の表示と操作
 * 画面: ホーム / 回 / カード学習 / 学習結果 / テスト / テスト結果 / 覚えていないリスト / 単語一覧 / 単語詳細 / 単語の編集 / 設定
 * URL の # で画面を切り替える（#home, #round-<id>, #study, #result, #test, #score-<id>, #misses,
 *   #words, #word-<id>, #edit-<id>, #new-word, #options）
 *
 * 操作の決まり（どの画面でも同じ形にする）
 *   青いボタン     … そのまとまりでいちばん大事な操作（1つだけ）
 *   白いボタン     … もう一つの操作
 *   › のある行     … 別の画面へ移る（赤い文字の行は、消す操作）
 *   切り替え       … 出題のしかたなど、2〜3個から選ぶもの
 *   再生｜ゆっくり … 英語の音声。下の小さな文字が音声の種類（AI音声・録音・端末の読み上げ）
 */
(function () {
  'use strict';

  const C = window.CIF;
  const util = C.util;
  const srs = C.srs;
  const SS = C.session;
  const ST = C.storage;
  const DG = C.diagrams;
  const Q = C.quiz;
  const esc = util.esc;

  const $app = document.getElementById('app');
  const $modal = document.getElementById('modal');
  const $toast = document.getElementById('toast');

  const SAMPLE_TEXT = 'Hello! This is how I sound.';

  let store = null;
  let speech = null;
  let aidSeq = 0;
  let packNoticeShown = false;
  const index = { words: new Map(), senses: new Map() };
  const navStack = [];
  const ui = {
    route: '',
    param: '',
    query: '',
    filter: 'all',
    hint: false,
    autoplayNext: false,
    editDraft: null,
    editErrors: [],
    editSourcesText: '',
    importPreview: null,
    importText: '',
    exportText: '',
    includeProgress: true,
    modal: null,
    roundFilter: 'all',
    missStatus: 'open',
    missRound: 'all',
    order: [],
    testFeedback: null,
    testIntro: '',
    fbTimer: null,
    editRound: '',
    deviceOpen: false,
  };

  /* ================= アイコン ================= */

  const ICON = {
    speaker: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
    slow: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 10.5a2 2 0 0 1 0 3"/>',
    mute: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
    home: '<path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>',
    cards: '<rect x="3.5" y="6" width="13" height="14" rx="2"/><path d="M7.5 6V4.5a1 1 0 0 1 1-1H19a1.5 1.5 0 0 1 1.5 1.5v11.5a1 1 0 0 1-1 1H16.5"/><path d="M6.5 11h7M6.5 14.5h5"/>',
    sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
    chevron: '<path d="M9 5l7 7-7 7"/>',
    share: '<path d="M8.5 9H7a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 7 20h10a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 17 9h-1.5"/><path d="M12 3.5v10M8.8 6.6L12 3.4l3.2 3.2"/>',
  };

  function icon(name, cls) {
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICON[name] + '</svg>';
  }

  /* ================= 起動 ================= */

  async function boot() {
    $app.innerHTML = '<div class="screen loading"><p>読み込み中…</p></div>';
    const backend = await ST.pickBackend();
    store = ST.createStore(backend);
    await store.init(C.seed);
    rebuildIndex();
    if (store.state.session) {
      const fixed = SS.sanitize(store.state.session, store.state.words);
      store.set('session', fixed);
    }
    speech = C.speech.create(window, () => store.state.settings);
    speech.onChange(refreshAudioUI);
    store.onStatus(() => {
      const el = document.getElementById('save-banner');
      if (el) el.outerHTML = saveBanner();
      else if (store.status.error) render(false);
    });

    window.addEventListener('hashchange', () => onRoute(false));
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKey);
    document.addEventListener('toggle', onToggle, true);
    document.addEventListener('submit', (e) => e.preventDefault());
    onRoute(true);
  }

  function rebuildIndex() {
    index.words = new Map();
    index.senses = new Map();
    store.state.words.forEach((w) => {
      index.words.set(w.id, w);
      w.senses.forEach((s, i) => index.senses.set(s.id, { word: w, sense: s, n: i + 1, total: w.senses.length }));
    });
  }

  function setWords(words) {
    store.set('words', words);
    rebuildIndex();
  }

  function setSettings(patch) {
    store.set('settings', Object.assign({}, store.state.settings, patch));
  }

  /* ================= 画面の切り替え ================= */

  function parseHash() {
    let h = '';
    try { h = decodeURIComponent((location.hash || '').replace(/^#/, '')); } catch (e) { h = ''; }
    if (!h || h === 'home') return { route: 'home', param: '' };
    if (['study', 'result', 'words', 'options', 'new-word', 'test', 'misses'].includes(h)) return { route: h, param: '' };
    if (h.indexOf('word-') === 0) return { route: 'word', param: h.slice(5) };
    if (h.indexOf('round-') === 0) return { route: 'round', param: h.slice(6) };
    if (h.indexOf('score-') === 0) return { route: 'score', param: h.slice(6) };
    if (h.indexOf('edit-') === 0) return { route: 'edit', param: h.slice(5) };
    return { route: 'home', param: '' };
  }

  /** how: 'push'（go で進む）/ 'replace'（入れ替え）/ なし（ブラウザの戻る・進む・リンク） */
  function onRoute(force, how) {
    const r = parseHash();
    const changed = r.route !== ui.route || r.param !== ui.param;
    if (!changed && !force) return;
    if (changed) {
      const key = r.route + ':' + r.param;
      if (how === 'replace' && navStack.length) navStack[navStack.length - 1] = key;
      else if (how === 'push') navStack.push(key);
      else if (navStack.length > 1 && navStack[navStack.length - 2] === key) navStack.pop();
      else navStack.push(key);
      if (navStack.length > 60) navStack.shift();
      if (speech) speech.stop();
    }
    ui.route = r.route;
    ui.param = r.param;
    if (changed) {
      ui.hint = false;
      if (r.route === 'edit' || r.route === 'new-word') prepareEditor();
      if (r.route !== 'options') ui.importPreview = null;
    }
    render(true);
  }

  /**
   * 画面を移動する（クリック処理の中ですぐ描画するので、音声の自動再生も動く）
   * replace: 履歴に残さず今の画面と入れ替える（リダイレクトや保存後の移動）
   */
  function go(hash, replace) {
    if (('#' + hash) !== location.hash) {
      if (replace) location.replace('#' + hash);
      else location.hash = hash;
    }
    onRoute(true, replace ? 'replace' : 'push');
  }

  function goBack(fallback) {
    if (navStack.length > 1) history.back();
    else go(fallback, true);
  }

  function render(resetScroll) {
    let html = null;
    switch (ui.route) {
      case 'study': html = viewStudy(); break;
      case 'result': html = viewResult(); break;
      case 'words': html = viewWords(); break;
      case 'word': html = viewWord(); break;
      case 'edit':
      case 'new-word': html = viewEdit(); break;
      case 'options': html = viewOptions(); break;
      case 'round': html = viewRound(); break;
      case 'test': html = viewTest(); break;
      case 'score': html = viewScore(); break;
      case 'misses': html = viewMisses(); break;
      default: html = viewHome();
    }
    if (html == null) return;
    const withNav = ['home', 'words', 'word', 'options', 'round', 'score', 'misses'].includes(ui.route);
    $app.innerHTML = saveBanner() + html + (withNav ? navBar() : '');
    document.body.dataset.route = ui.route;
    if (resetScroll) window.scrollTo(0, 0);
    afterRender();
  }

  function afterRender() {
    if (ui.route === 'study') {
      const s = store.state.session;
      if (ui.autoplayNext) {
        ui.autoplayNext = false;
        if (store.state.settings.autoplay && s && !s.flipped && s.mode === 'fwd') {
          const btn = $app.querySelector('.card-front .audio button[data-slow="0"]:not([disabled])');
          if (btn) playFrom(btn);
        }
      }
      preloadStudy(s);
    }
    if (ui.route === 'result') {
      const h = document.getElementById('result-title');
      if (h) h.focus({ preventScroll: true });
    }
  }

  function navBar() {
    const item = (route, hash, ic, label) => {
      const cur = ui.route === route || (route === 'words' && ui.route === 'word') || (route === 'home' && (ui.route === 'round' || ui.route === 'score'));
      return '<a class="nav-item' + (cur ? ' is-current' : '') + '" href="#' + hash + '"' + (cur ? ' aria-current="page"' : '') + '>' +
        icon(ic) + '<span>' + label + '</span></a>';
    };
    return '<nav class="bottom-nav" aria-label="メニュー">' +
      item('home', 'home', 'home', 'ホーム') + item('words', 'words', 'cards', '単語') + item('misses', 'misses', 'list', '復習リスト') + item('options', 'options', 'sliders', '設定') +
      '</nav>';
  }

  function saveBanner() {
    const st = store && store.status;
    if (!st) return '';
    let msg = '';
    if (st.error) msg = st.error;
    else if (!st.persistent) msg = 'このブラウザでは学習記録を保存できません。ページを閉じると記録が消えます。設定の「ファイルに書き出す」で保存してください。';
    if (!msg) return '<div id="save-banner" hidden></div>';
    return '<div id="save-banner" class="banner warn" role="alert">' + esc(msg) + '</div>';
  }

  /* ================= 共通の部品 ================= */

  /** 見出し（戻るボタン・題名・右側の操作） */
  function pageHead(title, opts) {
    const o = opts || {};
    const right = o.right ? '<div class="side right">' + o.right + '</div>' : '';
    if (!o.back) return '<header class="page-head"><h1 tabindex="-1">' + esc(title) + '</h1>' + right + '</header>';
    return '<header class="page-head sub"><div class="side"><button type="button" class="icon-btn" data-action="back" data-fallback="' + esc(o.back) + '" aria-label="戻る">' + icon('back') + '</button></div>' +
      '<h1 tabindex="-1">' + esc(title) + '</h1>' + (right || '<div class="side right"></div>') + '</header>';
  }

  function section(title, body, opts) {
    const o = opts || {};
    return '<section class="section"' + (o.id ? ' id="' + o.id + '"' : '') + '>' +
      (title ? '<h2 class="section-title">' + esc(title) + (o.note ? '<span>' + esc(o.note) + '</span>' : '') + '</h2>' : '') +
      body + '</section>';
  }

  /** 一覧の行。title / sub は文字列、detail は HTML。cls に danger / action を入れると › を出さない */
  function rowInner(title, sub, detail, cls) {
    const chev = !/\b(danger|action)\b/.test(cls || '');
    return '<span class="r-main"><span class="r-title">' + esc(title) + '</span>' + (sub ? '<span class="r-sub">' + esc(sub) + '</span>' : '') + '</span>' +
      (detail ? '<span class="r-detail">' + detail + '</span>' : '') + (chev ? icon('chevron') : '');
  }

  function rowLink(href, title, sub, detail, cls) {
    return '<a class="row' + (cls ? ' ' + cls : '') + '" href="' + esc(href) + '">' + rowInner(title, sub, detail, cls) + '</a>';
  }

  function rowBtn(action, attrs, title, sub, detail, cls) {
    return '<button type="button" class="row' + (cls ? ' ' + cls : '') + '" data-action="' + action + '"' + (attrs || '') + '>' + rowInner(title, sub, detail, cls) + '</button>';
  }

  function segButtons(action, current, items, label) {
    return '<div class="seg" role="group" aria-label="' + esc(label) + '">' + items.map(([v, l]) =>
      '<button type="button" data-action="' + action + '" data-v="' + esc(v) + '" aria-pressed="' + (v === current) + '">' + esc(l) + '</button>').join('') + '</div>';
  }

  function selectBox(id, current, items, label) {
    return '<div class="select"><select id="' + id + '" aria-label="' + esc(label) + '">' +
      items.map(([v, l]) => '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select></div>';
  }

  function toggleRow(id, label, checked, sub) {
    return '<label class="toggle" for="' + id + '"><span class="t-text"><span>' + esc(label) + '</span>' + (sub ? '<span class="r-sub">' + esc(sub) + '</span>' : '') + '</span>' +
      '<input type="checkbox" id="' + id + '" role="switch"' + (checked ? ' checked' : '') + '></label>';
  }

  function posLabel(pos) {
    return ST.POS[pos] || 'その他';
  }

  function roleLine(sense) {
    const pos = posLabel(sense.pos);
    if (!sense.role) return '<p class="role-line"><span class="role-chip">' + esc(pos) + '</span></p>';
    return '<p class="role-line"><span class="role-chip">' + esc(ST.ROLE[sense.role]) + '</span>を表す言葉<span class="role-pos">（' + esc(pos) + '）</span></p>';
  }

  function ipaOf(sense) {
    const accent = store.state.settings.accent;
    const ipa = sense.ipa || {};
    return (accent === 'uk' ? ipa.uk || ipa.us : ipa.us || ipa.uk) || '';
  }

  /* ----- 音声 ----- */

  /** AI音声（音声パック）の中の、この英語の部分（ファイル・開始秒・終了秒） */
  /** 英語を比べるための形（大文字・小文字、’ と '、空白の違いを無視） */
  function sameText(a, b) {
    const f = (x) => String(x || '').replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim().toLowerCase();
    return f(a) === f(b);
  }

  /**
   * AI音声の中の1つの区間。key は単語なら '#用法ID'、フレーズ・文なら英語そのもの。
   * expect：画面でボタンのとなりに出している英語。目録の英語と同じときだけ使う（違う音は鳴らさない）。
   */
  function packClip(key, slow, expect) {
    const pack = C.audioPack;
    if (!pack || !pack.clips || (speech && speech.packFailed)) return null;
    const c = pack.clips[(slow ? 's|' : 'n|') + String(key || '').trim()];
    if (!c || c.length < 5 || !(c[2] > c[1])) return null;
    if (expect != null && !sameText(c[4], expect)) return null;
    return { url: (pack.base || '') + c[0], a: c[1], b: c[2], dur: c[3], text: c[4], key: String(key).trim() };
  }

  function packCount() {
    const pack = C.audioPack;
    return pack && pack.clips ? Object.keys(pack.clips).filter((k) => k.indexOf('n|') === 0).length : 0;
  }

  /**
   * 使う音声の種類：録音 → AI音声 → 端末の読み上げ
   * o: { text（端末の読み上げで読む英語）, key（AI音声のキー。なければ text）, expect（となりに出している英語。なければ text）,
   *      src（録音URL）, synth（端末の読み上げを試すとき）, off（要確認などで鳴らさない） }
   */
  function audioSource(o) {
    if (o.off) return { kind: 'off' };
    if (o.synth) return { kind: 'synth' };
    if (o.src) return { kind: 'rec' };
    const key = o.key || o.text;
    const expect = o.expect != null ? o.expect : o.text;
    const n = packClip(key, false, expect);
    const s = n && packClip(key, true, expect);
    if (n && s) return { kind: 'pack', n, s };
    return { kind: 'synth' };
  }

  /** 単語の音声：用法ごとに、見出し語だけを、その用法の発音で（AI音声のキー '#用法ID'） */
  function wordAudio(item) {
    const s = item.sense;
    return {
      key: '#' + s.id,
      expect: item.word.headword,
      // 端末の読み上げは発音を指定できないので、品詞で読みが変わる語だけ、その発音になる語句（speak）を読む
      text: s.speak || item.word.headword,
      src: s.audio && s.audio.word,
      off: !isStudyable(item.word, s),
    };
  }

  function capText(kind) {
    if (kind === 'off') return '要確認のため、音声はありません';
    if (kind === 'rec') return '録音（人の声）';
    if (kind === 'pack') return 'AI音声・アメリカ英語';
    if (speech && speech.canSynth()) return '端末の読み上げ';
    if (speech && speech.status === 'loading') return '音声を準備中…';
    return 'この端末では再生できません';
  }

  function audioAttrs(src, text, slow, recorded) {
    const aid = 'a' + (++aidSeq);
    let a = ' data-action="speak" data-aid="' + aid + '" data-kind="' + src.kind + '" data-text="' + esc(text) + '" data-slow="' + (slow ? '1' : '0') + '"';
    if (src.kind === 'rec') a += ' data-src="' + esc(recorded) + '"';
    if (src.kind === 'pack') {
      const c = slow ? src.s : src.n;
      a += ' data-src="' + esc(c.url) + '" data-a="' + c.a + '" data-b="' + c.b + '" data-dur="' + c.dur + '" data-key="' + esc(c.key) + '" data-clip="' + esc(c.text) + '"';
    }
    return a;
  }

  /**
   * 音声の操作（どの画面でも同じ形）：［再生｜ゆっくり］と、その下に音声の種類
   * opts: text, src（録音URL）, what（何を読むか）, sm, left,
   *       cap（true=いつも種類を出す / 'auto'=AI音声以外のときだけ出す）
   */
  function audioCtl(opts) {
    const text = String(opts.text || '').trim();
    const src = audioSource(Object.assign({}, opts, { text }));
    const enabled = src.kind === 'pack' || src.kind === 'rec' || (src.kind === 'synth' && !!(speech && speech.canSynth()));
    const what = opts.what || '英語';
    const kindName = src.kind === 'rec' ? '録音' : src.kind === 'pack' ? 'AI音声' : '端末の読み上げ';
    const btn = (slow) => '<button type="button"' + audioAttrs(src, text, slow, opts.src) +
      ' aria-label="' + esc(what + 'を' + (slow ? 'ゆっくり' : '') + '再生（' + kindName + '）') + '"' + (enabled ? '' : ' disabled') + '>' +
      icon(enabled ? (slow ? 'slow' : 'speaker') : 'mute') + '<span>' + (slow ? 'ゆっくり' : '再生') + '</span></button>';
    const showCap = opts.cap === true || (opts.cap === 'auto' && src.kind !== 'pack') || src.kind === 'off';
    const cap = capText(src.kind);
    // 種類の表示は、AI音声の例文などではふだん隠し、再生中だけ「何倍で再生しているか」を出す
    return '<div class="audio-wrap' + (opts.left ? ' left' : '') + '">' +
      '<div class="audio' + (opts.sm ? ' sm' : '') + (enabled ? '' : ' off') + '" role="group" aria-label="' + esc(what + 'の音声') + '" data-kind="' + src.kind + '">' + btn(false) + btn(true) + '</div>' +
      '<span class="audio-cap" aria-live="polite" data-cap="' + esc(cap) + '"' + (showCap ? '' : ' data-hide="1" hidden') + '>' + esc(cap) + '</span></div>';
  }

  /** ゆっくりの倍率（音声パックの設定から。1語・2〜4語・5語以上） */
  function slowFactor(text) {
    const sl = (C.audioPack && C.audioPack.slow) || {};
    const n = String(text || '').trim().split(/\s+/).length;
    return n === 1 ? sl['1'] : n <= 4 ? sl['2-4'] : sl['5+'];
  }

  /** 再生中に出す文（ゆっくりは、ふつうの何倍の長さか・何秒か） */
  function playingText(btn, kind, slow) {
    if (kind === 'pack') {
      const pad = ((C.audioPack && C.audioPack.pad) || [0, 0]).reduce((x, y) => x + y, 0);
      const sec = Math.max(0.1, Number(btn.dataset.dur) - pad).toFixed(1);
      if (!slow) return '再生中（' + sec + '秒）';
      const f = slowFactor(btn.dataset.clip || btn.dataset.text);
      return 'ゆっくり再生中（' + (f ? 'ふつうの' + f + '倍・' : '') + sec + '秒）';
    }
    if (!slow) return '再生中';
    return kind === 'rec' ? 'ゆっくり再生中（録音）' : 'ゆっくり再生中（端末の読み上げ）';
  }

  /** 再生中の表示をすべて元に戻す */
  function clearPlaying() {
    $app.querySelectorAll('.audio button.playing, .speak-one.playing').forEach((b) => b.classList.remove('playing'));
    $app.querySelectorAll('.audio.run').forEach((g) => {
      g.classList.remove('run', 'timed');
      const cap = g.parentElement && g.parentElement.querySelector('.audio-cap');
      if (cap) {
        cap.textContent = cap.dataset.cap || '';
        cap.hidden = cap.dataset.hide === '1';
        cap.classList.remove('live');
      }
    });
  }

  /** 丸い再生ボタン（表面のフレーズ用） */
  function speakOne(text, what, off) {
    const t = String(text || '').trim();
    const src = audioSource({ text: t, off });
    const enabled = src.kind === 'pack' || (src.kind === 'synth' && !!(speech && speech.canSynth()));
    return '<button type="button" class="speak-one"' + audioAttrs(src, t, false, '') +
      ' aria-label="' + esc((what || 'フレーズ') + 'を再生') + '"' + (enabled ? '' : ' disabled') + '>' + icon(enabled ? 'speaker' : 'mute') + '</button>';
  }

  /** 端末の読み上げを使うのに、声がまだ・ないときだけ出すお知らせ */
  function speechBanner(kind) {
    const need = kind === 'synth' && speech && speech.status !== 'ready';
    if (!need) return '<div data-speech-banner data-kind="' + kind + '" hidden></div>';
    const loading = speech.status === 'loading';
    return '<div data-speech-banner data-kind="' + kind + '" class="banner ' + (loading ? 'info' : 'warn') + '" role="status">' +
      esc(speech.message()) + (loading ? '' : ' <a href="#options">音声の設定</a>') + '</div>';
  }

  /** 端末の声が使えるようになったら、表示中のボタンを更新する */
  function refreshAudioUI() {
    const ok = speech.canSynth();
    $app.querySelectorAll('.audio[data-kind="synth"]').forEach((g) => {
      g.classList.toggle('off', !ok);
      g.querySelectorAll('button').forEach((b) => {
        b.disabled = !ok;
        const ic = b.querySelector('.ic');
        if (ic) ic.outerHTML = icon(ok ? (b.dataset.slow === '1' ? 'slow' : 'speaker') : 'mute');
      });
      const cap = g.parentElement && g.parentElement.querySelector('.audio-cap');
      if (cap && !cap.classList.contains('live')) {
        cap.dataset.cap = capText('synth');
        cap.textContent = cap.dataset.cap;
      }
    });
    $app.querySelectorAll('.speak-one[data-kind="synth"]').forEach((b) => {
      b.disabled = !ok;
      const ic = b.querySelector('.ic');
      if (ic) ic.outerHTML = icon(ok ? 'speaker' : 'mute');
    });
    $app.querySelectorAll('[data-speech-banner]').forEach((el) => {
      el.outerHTML = speechBanner(el.dataset.kind || 'synth');
    });
    const dv = document.getElementById('device-voice');
    if (dv) dv.outerHTML = deviceVoiceHtml();
  }

  function playFrom(btn) {
    const aid = btn.dataset.aid;
    const kind = btn.dataset.kind;
    const slow = btn.dataset.slow === '1';
    const text = btn.dataset.text || '';
    const mark = (on) => {
      clearPlaying();
      if (!on) return;
      const b = $app.querySelector('[data-aid="' + aid + '"]');
      if (!b) return;
      b.classList.add('playing');
      const g = b.closest('.audio');
      if (!g) return;
      // 再生の長さだけ進む線（AI音声は長さが分かる。それ以外は動き続ける線）
      const dur = kind === 'pack' ? Number(b.dataset.dur) : 0;
      g.style.setProperty('--dur', (dur || 1.2) + 's');
      g.classList.toggle('timed', !!dur);
      g.classList.add('run');
      const cap = g.parentElement && g.parentElement.querySelector('.audio-cap');
      if (cap) {
        cap.textContent = playingText(b, kind, slow);
        cap.hidden = false;
        cap.classList.add('live');
      }
    };
    const synthState = (state, detail) => {
      mark(state === 'playing');
      if (state === 'error') toast(audioError(detail, false));
    };
    const onState = (state, detail) => {
      mark(state === 'playing');
      if (state !== 'error') return;
      if (detail === 'pack') {
        // AI音声を読み込めなかった → 端末の読み上げに切り替える
        if (!packNoticeShown) {
          packNoticeShown = true;
          toast('AI音声を読み込めませんでした。端末の読み上げに切り替えます。');
        }
        render(false);
        if (speech.canSynth()) speech.speak(text, { slow, onState: synthState });
        return;
      }
      toast(audioError(detail, kind === 'rec'));
    };
    let ok;
    if (kind === 'pack') ok = speech.playClip(btn.dataset.src, Number(btn.dataset.a), Number(btn.dataset.b), { onState });
    else if (kind === 'rec') ok = speech.play(btn.dataset.src, { slow, isSlowFile: false, onState });
    else ok = speech.speak(text, { slow, onState });
    if (!ok) toast(speech.message() || '音声を再生できません。');
  }

  function audioError(code, recorded) {
    if (recorded) return '録音を再生できませんでした。ファイルの場所（URL）を確認してください。';
    if (code === 'no-start') return '音声が再生されませんでした。音量や、設定の「端末の読み上げ」の声を確認してください。';
    if (code === 'not-allowed') return 'ブラウザが音声を止めました。もう一度ボタンを押してください。';
    if (code === 'voice-unavailable' || code === 'language-unavailable') return '選んだ英語の声が使えません。設定で別の声を選んでください。';
    return '音声の再生に失敗しました。もう一度試してください。';
  }

  /** 次に出るカードの音声を先に読み込んでおく */
  function preloadStudy(s) {
    if (!s || !speech || !s.queue) return;
    s.queue.slice(0, 2).forEach((sid, i) => {
      const it = index.senses.get(sid);
      if (!it) return;
      [false, true].forEach((slow) => {
        if (slow && i > 0) return;
        const c = packClip('#' + sid, slow, it.word.headword);
        if (c) speech.preload(c.url, c.a, c.b);
      });
    });
  }

  /* ----- カードの中身 ----- */

  function sceneArt(sense) {
    const d = sense.scene && sense.scene.diagram;
    if (d && DG.has(d)) return '<div class="scene-art has-dg">' + DG.get(d) + '</div>';
    return '';
  }

  function stressHtml(stress) {
    if (!stress) return '';
    const parts = stress.split(/[·・\-\s]+/).filter(Boolean);
    if (parts.length < 2) return '';
    return '<span class="stress" aria-label="強く読む位置：' + esc(parts.filter((p) => p === p.toUpperCase()).join('').toLowerCase()) + '">' +
      parts.map((p) => {
        const strong = p === p.toUpperCase() && /[A-Z]/.test(p);
        return '<span class="syl' + (strong ? ' strong' : '') + '"><i></i>' + esc(p.toLowerCase()) + '</span>';
      }).join('') + '</span>';
  }

  function exampleHtml(item, ex, i) {
    const src = (item.sense.audio && item.sense.audio.examples && item.sense.audio.examples[i]) || '';
    return '<div class="ex">' +
      '<p class="ex-en" lang="en">' + util.markedHtml(ex.en) + '</p>' +
      (ex.ja ? '<p class="ex-ja">' + esc(ex.ja) + '</p>' : '') +
      audioCtl({ text: util.plainSentence(ex.en), src, what: '例文', sm: true, left: true, cap: 'auto', off: !isStudyable(item.word, item.sense) }) +
      '</div>';
  }

  /** 端末の読み上げで、品詞で読みが変わる語を語句で読むときだけ、そのことを書く */
  function speakNote(item) {
    const sp = item.sense.speak;
    if (!sp || sameText(sp, item.word.headword)) return '';
    if (audioSource(wordAudio(item)).kind !== 'synth') return '';
    return '<p class="speak-note">端末の読み上げでは、この用法の発音にするため「<span lang="en">' + esc(sp) + '</span>」と読みます</p>';
  }

  /** 場面→英語の練習用に、例文の単語を空欄にする（空欄にできない例文は英語を出さない） */
  function clozeFor(item) {
    const head = item.word.headword;
    for (const ex of item.sense.examples) {
      if (util.parseMarked(ex.en).some((p) => p.hit)) return { en: util.clozeHtml(ex.en), ja: ex.ja };
      const re = new RegExp('\\b' + head.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*', 'i');
      if (re.test(ex.en)) {
        return { en: util.clozeHtml(ex.en.replace(re, (m) => '[' + m + ']')), ja: ex.ja };
      }
    }
    const first = item.sense.examples[0];
    return first && first.ja ? { en: '', ja: first.ja } : null;
  }

  function hintText(head) {
    return head.split(' ').map((w) => w.charAt(0) + ' ' + Array(Math.max(0, w.length - 1)).fill('_').join(' ')).join('　') +
      '（' + head.replace(/\s/g, '').length + '文字）';
  }

  function statusBadge(status) {
    const s = ST.STATUS[status] || ST.STATUS.unverified;
    return '<span class="badge st-' + s.key + '">' + s.label + '</span>';
  }

  function levelChip(state) {
    const lv = srs.level(state);
    return '<span class="level lv-' + lv.key + '">' + lv.label + '</span>';
  }

  function isStudyable(word, sense) {
    return word.status !== 'needs_review' && sense.status !== 'needs_review';
  }

  function doneMark() {
    return '<svg class="done-mark" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-15"/></svg>';
  }

  /* ================= ホーム ================= */

  /** ホームの上：今日の目標（輪）・連続学習・ポイント */
  function heroCard(streak, today, goal, points) {
    const done = Math.min(goal, today.cards);
    const c = 2 * Math.PI * 52;
    const off = c * (1 - done / goal);
    return '<section class="hero" aria-label="今日の記録">' +
      '<div class="hero-ring" role="progressbar" aria-label="今日の目標の進み具合" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + done + '">' +
      '<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="hero-metal" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#e3eef9"/><stop offset=".3" stop-color="#8fb6dd"/><stop offset=".62" stop-color="#4f7fae"/><stop offset="1" stop-color="#c3d8ee"/></linearGradient></defs>' +
      '<circle class="ring-track" cx="60" cy="60" r="52"/>' +
      '<circle class="ring-fill" cx="60" cy="60" r="52" stroke="url(#hero-metal)" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"' + (done ? '' : ' opacity="0"') + '/></svg>' +
      '<p class="ring-text"><b class="num">' + today.cards + '</b><span>/ ' + goal + '枚</span></p></div>' +
      '<div class="hero-side"><p class="hero-label">今日の目標' + (today.cards >= goal ? '<span class="hero-done">達成</span>' : '') + '</p>' +
      '<dl class="hero-stats">' +
      '<div><dt>連続学習</dt><dd class="num">' + streak.days + '<small>日</small></dd></div>' +
      '<div><dt>ポイント</dt><dd class="num">' + points + '</dd></div></dl>' +
      (streak.days && !streak.todayDone ? '<p class="hero-note">今日はまだ学習していません</p>' : '') +
      '</div></section>';
  }

  function todayLabel(now) {
    const d = new Date(now);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日月火水木金土'.charAt(d.getDay()) + '）';
  }

  /** カード学習を始めるまとまり：出題のしかた（切り替え）＋ 枚数 ＋ 青いボタン */
  function studyGroup(c, scope) {
    const mode = store.state.settings.studyMode === 'rev' ? 'rev' : 'fwd';
    const fwd = mode === 'fwd';
    const can = fwd ? c.total > 0 : c.availableRev > 0;
    const counts = fwd
      ? '<span><b>' + c.dueFwd + '</b>復習</span><span><b>' + c.newFwd + '</b>新しい</span>'
      : '<span><b>' + c.dueRev + '</b>復習</span><span><b>' + c.newRev + '</b>新しい</span>';
    return '<div class="group">' +
      segButtons('set-mode', mode, [['fwd', '英語 → 場面'], ['rev', '場面 → 英語']], '出題のしかた') +
      '<p class="counts">' + counts + '</p>' +
      '<button type="button" class="btn primary block" data-action="start" data-mode="' + mode + '" data-scope="' + esc(scope) + '"' + (can ? '' : ' disabled') + '>カードで学習する</button>' +
      (!fwd && !c.availableRev ? '<p class="fine">「場面 → 英語」は、「英語 → 場面」で一度学習したカードから出ます。</p>' : '') +
      '</div>';
  }

  function viewHome() {
    const st = store.state;
    const now = Date.now();
    const c = SS.counts(st.words, st.progress, now);
    const streak = SS.streak(st.log, now);
    const today = SS.today(st.log, now);
    const goal = st.settings.dailyGoal;
    const sess = st.session && !st.session.finished ? st.session : null;
    const cur = st.tests && st.tests.current;
    const mc = Q.missCounts(st.tests);

    let html = '<main class="screen home" id="main">';
    html += '<header class="page-head home-head"><p class="eyebrow">' + esc(todayLabel(now)) + '</p><h1 tabindex="-1">コアイメージ単語帳</h1></header>';
    html += heroCard(streak, today, goal, st.log.totalPoints);

    if (sess || cur) {
      html += section('途中から', '<div class="list">' +
        (sess ? rowBtn('resume', '', 'カード学習の続き', scopeLabel(sess.scope) + '・' + SS.MODES[sess.mode].label + '・残り ' + SS.remaining(sess) + '枚', '', 'accent') : '') +
        (cur ? rowBtn('resume-test', '', 'テストの続き', attemptTitle(cur) + '・残り ' + (cur.questions.length - cur.index) + '問', '', 'accent') : '') +
        '</div>');
    }

    html += section('今日の学習', studyGroup(c, 'all'), { note: 'すべての回から' });

    html += section('回', st.rounds.length
      ? '<div class="list">' + st.rounds.map(roundRow).join('') + '</div>'
      : '<p class="section-note">まだ回がありません。</p>');

    html += section('復習', '<div class="list">' +
      rowLink('#misses', '覚えていないリスト', 'テストで間違えた問題・克服 ' + mc.solved + '件', '<b>' + mc.open + '</b>件') +
      '</div>');

    html += section('これからの復習', '<div class="group"><dl class="facts">' +
      '<div><dt>いま</dt><dd>' + (c.dueFwd + c.dueRev) + '<small>枚</small></dd></div>' +
      '<div><dt>明日</dt><dd>' + c.tomorrow + '<small>枚</small></dd></div>' +
      '<div><dt>7日以内</dt><dd>' + c.week + '<small>枚</small></dd></div>' +
      '</dl></div>');

    html += '</main>';
    return html;
  }

  /** ホームに並べる回の行 */
  function roundRow(r) {
    const st = store.state;
    const items = Q.roundItems(st.words, r);
    const lv = { new: 0, learning: 0, reviewing: 0, settled: 0 };
    items.forEach((it) => { lv[srs.level(SS.stateOf(st.progress, it.sense.id, 'fwd')).key] += 1; });
    const seg = (k) => (lv[k] ? '<span class="lv-seg lv-' + k + '" style="flex:' + lv[k] + '"></span>' : '');
    const stats = Q.roundStats(st.tests, r.id);
    const studied = items.length - lv.new;
    const sub = r.wordIds.length + '語・学習済み ' + studied + '/' + items.length + '・' +
      (stats.count ? '最高 ' + stats.best + '点' + (stats.perfectAt ? '（' + stats.perfectAt.no + '回目で満点）' : '') : 'テスト未受験');
    return '<a class="row" href="#round-' + esc(r.id) + '"><span class="r-main"><span class="r-title">' + esc(r.title) + '</span>' +
      '<span class="r-sub">' + esc(sub) + '</span>' +
      '<span class="lv-bar" aria-hidden="true">' + seg('settled') + seg('reviewing') + seg('learning') + seg('new') + '</span></span>' +
      icon('chevron') + '</a>';
  }

  /* ================= カード学習 ================= */

  function topbar(quitAction, label, ratio, remainHtml, progressLabel) {
    const pct = Math.round(ratio * 100);
    return '<header class="topbar">' +
      '<button type="button" class="icon-btn" data-action="' + quitAction + '" aria-label="中断してホームへ（続きは保存されます）">' + icon('close') + '</button>' +
      '<div class="t-mid"><span class="t-label">' + esc(label) + '</span>' +
      '<div class="progress" role="progressbar" aria-label="' + esc(progressLabel) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div></div>' +
      '<p class="remain">' + remainHtml + '</p></header>';
  }

  function cardMeta(item, repeat) {
    if (item.total <= 1 && !repeat) return '';
    return '<div class="card-meta">' +
      (item.total > 1 ? '<span class="tag">用法 ' + item.n + ' / ' + item.total + '</span>' : '<span></span>') +
      (repeat ? '<span class="chip accent">もう一度</span>' : '') + '</div>';
  }

  function viewStudy() {
    const st = store.state;
    let s = st.session;
    if (!s) { go('home', true); return null; }
    if (s.finished) { go('result', true); return null; }
    let sid = SS.current(s);
    let item = index.senses.get(sid);
    if (!item || !isStudyable(item.word, item.sense)) {
      s = SS.sanitize(s, st.words);
      store.set('session', s);
      if (!s || s.finished) { go('home', true); return null; }
      sid = SS.current(s);
      item = index.senses.get(sid);
    }
    const res = s.results[sid];
    const repeat = !!(res && res.first);
    const kind = audioSource(wordAudio(item)).kind;

    let html = '<main class="screen study" id="main">';
    html += topbar('quit', scopeLabel(s.scope) + '・' + SS.MODES[s.mode].label, SS.progressRatio(s), '残り <b>' + SS.remaining(s) + '</b>枚', 'セットの進み具合');
    html += speechBanner(kind);
    const meta = cardMeta(item, repeat);
    if (!s.flipped) {
      html += s.mode === 'rev' ? frontRev(item, meta) : frontFwd(item, meta);
      html += '<div class="answer-bar"><button type="button" class="btn primary block" data-action="flip">裏を見る</button></div>';
    } else {
      html += backCard(item, meta, s.mode);
      html += rateBar(s, sid);
    }
    html += '</main>';
    return html;
  }

  function frontFwd(item, meta) {
    const w = item.word;
    const sense = item.sense;
    const ipa = ipaOf(sense);
    return '<article class="card card-front" data-action="flip" role="button" tabindex="0" aria-label="カードをめくって裏を見る">' + meta +
      '<div class="front-body">' +
      '<h2 class="headword" lang="en">' + esc(w.headword) + '</h2>' +
      (ipa ? '<p class="ipa" lang="en">' + esc(ipa) + '</p>' : '') +
      audioCtl(Object.assign(wordAudio(item), { what: '単語', cap: true })) +
      speakNote(item) +
      (sense.cue ? '<div class="cue-line"><p class="cue" lang="en">' + esc(sense.cue) + '</p>' + speakOne(sense.cue, 'フレーズ') + '</div>' : '') +
      '</div>' +
      '<p class="tap-hint">意味と場面を思い浮かべたら、タップ</p>' +
      '</article>';
  }

  function frontRev(item, meta) {
    const sense = item.sense;
    const cz = clozeFor(item);
    return '<article class="card card-front rev" data-action="flip" role="button" tabindex="0" aria-label="カードをめくって答えを見る">' + meta +
      '<div class="front-body">' +
      '<p class="rev-q">この場面に合う英語は？</p>' +
      sceneArt(sense) +
      (sense.scene && sense.scene.text ? '<p class="scene-text">' + esc(sense.scene.text) + '</p>' : '') +
      (sense.nuance ? '<p class="nuance-text">' + esc(sense.nuance) + '</p>' : '') +
      roleLine(sense) +
      (cz ? '<div class="cloze">' + (cz.en ? '<p class="ex-en" lang="en">' + cz.en + '</p>' : '') + (cz.ja ? '<p class="ex-ja">' + esc(cz.ja) + '</p>' : '') + '</div>' : '') +
      (ui.hint
        ? '<p class="hint" lang="en">' + esc(hintText(item.word.headword)) + '</p>'
        : '<button type="button" class="btn text sm" data-action="hint">ヒントを見る</button>') +
      '</div>' +
      '<p class="tap-hint">英語を思い浮かべたら、タップ</p>' +
      '</article>';
  }

  function backCard(item, meta, mode) {
    const w = item.word;
    const sense = item.sense;
    const ipa = ipaOf(sense);
    let html = '<article class="card card-back" aria-label="カードの裏">' + meta;
    html += '<div class="back-head"><div class="bh-line"><h2 class="headword sm" lang="en">' + esc(w.headword) + '</h2>' +
      (ipa ? '<span class="ipa" lang="en">' + esc(ipa) + '</span>' : '') + '</div>' +
      audioCtl(Object.assign(wordAudio(item), { what: '単語', cap: true, left: true })) +
      speakNote(item) +
      (mode === 'rev' && sense.cue ? '<div class="cue-line"><p class="cue" lang="en">' + esc(sense.cue) + '</p>' + speakOne(sense.cue, 'フレーズ') + '</div>' : '') +
      '</div>';
    html += senseBody(item, { inCard: true });
    html += '</article>';
    return html;
  }

  /** 裏面と単語詳細で共通の中身（ニュアンス → 場面 → 意味と役割 → 例文 ＋ くわしく） */
  function senseBody(item, opts) {
    const sense = item.sense;
    let html = '';
    if (sense.nuance) {
      html += '<section class="sec"><h3 class="sec-label">一言ニュアンス</h3><p class="nuance-text">' + esc(sense.nuance) + '</p></section>';
    }
    const art = sceneArt(sense);
    if ((sense.scene && sense.scene.text) || art) {
      html += '<section class="sec"><h3 class="sec-label">頭に浮かべる場面</h3>' + art +
        (sense.scene.text ? '<p class="scene-text">' + esc(sense.scene.text) + '</p>' : '') + '</section>';
    }
    html += '<section class="sec"><h3 class="sec-label">意味と文の中での役割</h3>' +
      '<p class="meaning-text">' + esc(sense.meaning || '（意味が未入力です）') + '</p>' + roleLine(sense) + '</section>';
    if (sense.examples.length) {
      html += '<section class="sec"><h3 class="sec-label">例文</h3>' +
        sense.examples.map((ex, i) => exampleHtml(item, ex, i)).join('') + '</section>';
    }
    html += '<details class="more"><summary>似た単語との違い・発音</summary><div class="more-body">';
    if (sense.contrasts.length) {
      html += '<section class="sub"><h4>似た単語との違い</h4><ul class="contrast">' +
        sense.contrasts.map((c) => '<li><b lang="en">' + esc(c.word) + '</b><span>' + esc(c.text) + '</span></li>').join('') + '</ul></section>';
    }
    if (sense.roleText) {
      html += '<section class="sub"><h4>文の中での役割</h4><p>' + esc(sense.roleText) + '</p></section>';
    }
    html += '<section class="sub"><h4>発音</h4>' + pronHtml(item) + '</section>';
    if (sense.note) html += '<section class="sub"><h4>補足</h4><p>' + esc(sense.note) + '</p></section>';
    if (opts && opts.inCard) {
      const others = item.word.senses.filter((x) => x.id !== sense.id);
      html += '<section class="sub"><h4>同じ単語のほかの用法</h4>' +
        (others.length ? '<ul class="others">' + others.map((o) => '<li><span class="chip">' + esc(posLabel(o.pos)) + '</span>' + esc(o.meaning) + '</li>').join('') + '</ul>' : '<p class="muted">登録されている用法は、これだけです。</p>') +
        '<p><a href="#word-' + esc(item.word.id) + '">' + esc(item.word.headword) + ' の詳しい説明と出典</a></p></section>';
      html += '<p class="fine">コアイメージは理解を助けるための説明です。すべてのネイティブスピーカーが同じイメージを持っているとは限りません。</p>';
    }
    html += '</div></details>';
    return html;
  }

  function pronHtml(item) {
    const sense = item.sense;
    const ipa = sense.ipa || {};
    const rows = [];
    if (ipa.us) rows.push('<li><span class="mini-label">アメリカ</span><span class="ipa" lang="en">' + esc(ipa.us) + '</span></li>');
    if (ipa.uk) rows.push('<li><span class="mini-label">イギリス</span><span class="ipa" lang="en">' + esc(ipa.uk) + '</span></li>');
    let html = rows.length ? '<ul class="pron">' + rows.join('') + '</ul>' : '<p class="muted">発音記号は未入力です。</p>';
    const stress = stressHtml(sense.stress);
    if (stress) html += '<p class="stress-line">強く読む位置：' + stress + '</p>';
    const kind = audioSource(wordAudio(item)).kind;
    html += '<p class="fine">音声：' + (kind === 'rec' ? '録音（人の声）'
      : kind === 'pack' ? 'AI音声（アメリカ英語）'
      : speech && speech.canSynth() ? '端末の読み上げ（' + esc(speech.currentLabel()) + '）' : '端末の読み上げ（この端末では使えません）') + '</p>';
    return html;
  }

  function rateBar(s, sid) {
    const now = Date.now();
    const res = s.results[sid];
    const first = !res || !res.first;
    const st = SS.stateOf(store.state.progress, sid, s.mode);
    const next = (r) => {
      if (r === 'again') return first || res.repeats < SS.REQUEUE.again.max ? 'もう一度出ます' : '10分後';
      if (!first) return 'このセット完了';
      if (r === 'hard') return srs.previewLabel(st, 'hard', now) + '・もう一度';
      return srs.previewLabel(st, 'good', now);
    };
    const label = { again: '思い出せ<wbr>なかった', hard: esc(srs.RATING_LABEL.hard), good: esc(srs.RATING_LABEL.good) };
    const btn = (r) => '<button type="button" class="rate r-' + r + '" data-action="rate" data-r="' + r + '">' +
      '<span class="rate-label">' + label[r] + '</span><span class="rate-next">' + esc(next(r)) + '</span></button>';
    return '<div class="answer-bar"><p class="rate-q">思い出せましたか？</p><div class="rate-row">' +
      btn('again') + btn('hard') + btn('good') + '</div></div>';
  }

  function startSet(mode, scopeKeyStr) {
    const st = store.state;
    const doStart = () => {
      const { scope, only } = parseScope(scopeKeyStr || 'all');
      if (only && !only.length) {
        toast('出題できるカードがありません。');
        return;
      }
      const s = SS.build(st.words, st.progress, mode, Date.now(), { only, scope });
      if (!s) {
        toast(mode === 'rev' ? '「英語 → 場面」で学習したカードがまだありません。' : '出題できるカードがありません。');
        return;
      }
      store.set('session', s);
      ui.hint = false;
      ui.autoplayNext = true;
      go('study', ui.route === 'result');
    };
    if (st.session && !st.session.finished) {
      openModal({
        title: '新しいセットを始めますか？',
        body: '途中のセット（残り ' + SS.remaining(st.session) + '枚）は終了します。これまでの回答はすでに保存されています。',
        ok: '新しく始める',
        onOk: doStart,
      });
      return;
    }
    doStart();
  }

  function flip() {
    const s = store.state.session;
    if (!s || s.finished || s.flipped) return;
    s.flipped = true;
    store.set('session', s);
    render(true);
  }

  function rate(r) {
    const st = store.state;
    const s = st.session;
    if (!s || s.finished || !s.flipped) return;
    const now = Date.now();
    const out = SS.answer(s, st.progress, r, now);
    const la = SS.logAnswer(st.log, out.event, now, st.settings.dailyGoal);
    let log = la.log;
    const next = out.session;
    if (la.bonus) {
      next.goalReached = true;
      next.points += la.bonus;
    }
    if (next.finished) {
      const done = SS.logSetComplete(log, now);
      log = done.log;
      next.points += done.bonus;
      next.setBonus = done.bonus;
    }
    store.set('progress', out.progress);
    store.set('log', log);
    store.set('session', next);
    ui.hint = false;
    speech.stop();
    if (next.finished) {
      go('result', true);
    } else {
      ui.autoplayNext = true;
      render(true);
    }
  }

  /* ================= 学習結果 ================= */

  function viewResult() {
    const st = store.state;
    const s = st.session;
    if (!s || !s.finished) { go('home', true); return null; }
    const now = Date.now();
    const sum = SS.summary(s);
    const today = SS.today(st.log, now);
    const goal = st.settings.dailyGoal;
    const streak = SS.streak(st.log, now);
    const pct = Math.min(100, Math.round((today.cards / goal) * 100));
    let html = '<main class="screen result" id="main">';
    html += '<div class="result-hero">' + doneMark() +
      '<p class="eyebrow">' + esc(scopeLabel(s.scope)) + '・' + esc(SS.MODES[s.mode].label) + '</p>' +
      '<h1 id="result-title" tabindex="-1">セット完了</h1>' +
      '<p class="earned">+' + s.points + ' pt</p>' +
      (s.goalReached ? '<p class="goal-done">今日の目標を達成しました</p>' : '') +
      '</div>';
    html += '<section class="group" aria-label="自己評価の内訳"><div class="stats">' +
      '<div class="stat"><span class="stat-num m-good">' + sum.good + '</span><span class="stat-label">思い出せた</span></div>' +
      '<div class="stat"><span class="stat-num m-hard">' + sum.hard + '</span><span class="stat-label">あいまい</span></div>' +
      '<div class="stat"><span class="stat-num m-again">' + sum.again + '</span><span class="stat-label">思い出せなかった</span></div>' +
      '</div></section>';
    html += '<section class="group"><dl class="facts">' +
      '<div><dt>今日の目標</dt><dd>' + today.cards + '<small>/' + goal + '</small></dd></div>' +
      '<div><dt>連続学習</dt><dd>' + streak.days + '<small>日</small></dd></div>' +
      '<div><dt>ポイント合計</dt><dd>' + st.log.totalPoints + '</dd></div>' +
      '</dl><span class="meter" role="progressbar" aria-label="今日の目標の進み具合" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + Math.min(goal, today.cards) + '"><span style="width:' + pct + '%"></span></span>' +
      (sum.repeats ? '<p class="fine">セットの中で ' + sum.repeats + '回、もう一度練習しました。</p>' : '') +
      '</section>';
    html += section('次の復習', '<ul class="list result-list">' +
      s.cards.map((sid) => {
        const it = index.senses.get(sid);
        if (!it) return '';
        const r = s.results[sid] || {};
        const state = SS.stateOf(st.progress, sid, s.mode);
