<style>
/*
 * コアイメージ単語帳 — スタイル
 * Layout: 1カラム・スマホ縦優先。情報カード（罫線＋赤い見出し線）を机の上に置いたような面構成。
 */
:root {
  --desk: #e8edf3;        /* 背景（机） */
  --surface: #f6f8fb;     /* パネル */
  --card: #ffffff;        /* カードの紙 */
  --rule: #dfe8f3;        /* カードの青い罫線 */
  --margin-line: #e2a29c; /* カードの赤い見出し線 */
  --ink: #1b2640;         /* 文字 */
  --ink-2: #47536d;
  --ink-3: #7c879d;
  --line: #d3dae5;
  --accent: #2b59d1;      /* 青インク */
  --accent-ink: #ffffff;
  --accent-soft: #e1e9fb;
  --hl: #ffe27a;          /* 蛍光ペン */
  --stamp: #d2433a;       /* 採点の赤丸 */
  --good: #1b7f52;
  --good-soft: #def2e8;
  --hard: #9a610c;
  --hard-soft: #fbefd8;
  --again: #bf3434;
  --again-soft: #fbe3e3;
  --lv1: #b9cbf3;
  --lv2: #6f92e6;
  --lv3: #2b59d1;
  --sky: #cfe4fa;
  --night: #27314f;
  --moon: #f6e6a2;
  --paper-2: #eef2f7;
  --shadow: 0 1px 2px rgba(27, 38, 64, 0.07), 0 8px 24px rgba(27, 38, 64, 0.08);
  --font-en: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-ja: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-round: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-ipa: "Noto Sans", "Lucida Sans Unicode", "Segoe UI", "Arial Unicode MS", "Gentium Plus", sans-serif;
  --radius: 16px;
  --nav-h: 64px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0f141d;
    --surface: #161d29;
    --card: #1a2230;
    --rule: #222d40;
    --margin-line: #6b3a3d;
    --ink: #e7ecf5;
    --ink-2: #b0bacd;
    --ink-3: #7e899e;
    --line: #2c3649;
    --accent: #86a6ff;
    --accent-ink: #0d1530;
    --accent-soft: #1f2b49;
    --hl: #6a5719;
    --stamp: #f0736a;
    --good: #59c995;
    --good-soft: #14302a;
    --hard: #e8ad55;
    --hard-soft: #33280f;
    --again: #f28383;
    --again-soft: #3b1d21;
    --lv1: #34446b;
    --lv2: #5674bd;
    --lv3: #86a6ff;
    --sky: #2c4c70;
    --night: #070b16;
    --moon: #f0d97f;
    --paper-2: #232c3c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --desk: #0f141d;
  --surface: #161d29;
  --card: #1a2230;
  --rule: #222d40;
  --margin-line: #6b3a3d;
  --ink: #e7ecf5;
  --ink-2: #b0bacd;
  --ink-3: #7e899e;
  --line: #2c3649;
  --accent: #86a6ff;
  --accent-ink: #0d1530;
  --accent-soft: #1f2b49;
  --hl: #6a5719;
  --stamp: #f0736a;
  --good: #59c995;
  --good-soft: #14302a;
  --hard: #e8ad55;
  --hard-soft: #33280f;
  --again: #f28383;
  --again-soft: #3b1d21;
  --lv1: #34446b;
  --lv2: #5674bd;
  --lv3: #86a6ff;
  --sky: #2c4c70;
  --night: #070b16;
  --moon: #f0d97f;
  --paper-2: #232c3c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

/* ---------- 基本 ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--font-ja);
  font-size: 16px;
  line-height: 1.7;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--desk);
  z-index: 30;
}
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; line-height: 1.35; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent); }
:lang(en) { font-family: var(--font-en); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.screen {
  max-width: 600px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.screen.loading { min-height: 60vh; align-items: center; justify-content: center; color: var(--ink-3); }
body[data-route="study"] .screen { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); padding-top: 10px; gap: 12px; }
body[data-route="edit"] .screen, body[data-route="new-word"] .screen { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
body[data-route="result"] .screen { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 48px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1.5px solid transparent;
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  font-size: 1rem;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.08s ease, background-color 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--card); color: var(--accent); border-color: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line); }
.btn.danger { background: var(--again); color: #fff; }
.btn.danger-ghost { background: transparent; color: var(--again); border-color: color-mix(in srgb, var(--again) 45%, transparent); }
.btn.big { min-height: 56px; font-size: 1.1rem; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: 0.9rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-row.end { justify-content: flex-end; }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: inline-grid; place-items: center;
  border-radius: 50%; border: 0;
  background: transparent; color: var(--ink-2);
  cursor: pointer;
}
.icon-btn .ic { width: 24px; height: 24px; }
.text-link { font-weight: 700; }

/* 音声ボタン */
.audio-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.audio-row.center { justify-content: center; }
.audio-btn {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 6px 14px 6px 12px;
  border-radius: 999px;
  border: 1.5px solid var(--accent);
  background: var(--card);
  color: var(--accent);
  font-weight: 700; font-size: 0.95rem;
  cursor: pointer; touch-action: manipulation;
  position: relative;
}
.audio-btn.slow { border-style: dashed; }
.audio-btn.sm { min-height: 38px; padding: 4px 12px 4px 10px; font-size: 0.85rem; }
.audio-btn .src-tag {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em;
  padding: 1px 6px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent);
}
.audio-btn.playing { background: var(--accent); color: var(--accent-ink); }
.audio-btn.playing .src-tag { background: color-mix(in srgb, var(--accent-ink) 25%, transparent); color: var(--accent-ink); }
.audio-btn.playing::after {
  content: ""; position: absolute; inset: -5px; border-radius: inherit;
  border: 2px solid var(--accent); opacity: 0.6;
  animation: ping 1s ease-out infinite;
}
.audio-btn.is-off, .audio-btn[disabled] { border-color: var(--line); color: var(--ink-3); background: var(--surface); cursor: not-allowed; }
.audio-btn.is-off .src-tag { background: var(--line); color: var(--ink-2); }
@keyframes ping { from { transform: scale(0.96); opacity: 0.6; } to { transform: scale(1.12); opacity: 0; } }

/* ---------- 共通パーツ ---------- */
.chip {
  display: inline-flex; align-items: center; flex: none; white-space: nowrap;
  min-height: 26px; padding: 1px 10px;
  border-radius: 999px;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--line);
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.02em;
}
.chip.mode { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.ghost { background: transparent; }
.chip.pos { background: var(--paper-2); }
.chip.again-chip { background: var(--again-soft); color: var(--again); border-color: transparent; }
.badge {
  display: inline-flex; align-items: center;
  padding: 1px 8px; border-radius: 6px;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em;
  white-space: nowrap;
}
.st-verified { background: var(--good-soft); color: var(--good); }
.st-unverified { background: var(--paper-2); color: var(--ink-2); }
.st-needs_review { background: var(--hard-soft); color: var(--hard); }
.banner {
  padding: 12px 14px; border-radius: 12px;
  font-size: 0.92rem; line-height: 1.6;
  background: var(--accent-soft); color: var(--ink);
}
.banner.warn { background: var(--hard-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--hard) 35%, transparent); }
.banner.info { background: var(--surface); color: var(--ink-2); }
.banner ul { list-style: disc; padding-left: 1.2em; margin: 6px 0; }
#save-banner.banner { max-width: 600px; margin: 10px auto 0; margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 632px) { #save-banner.banner { margin-left: auto; margin-right: auto; } }
.muted { color: var(--ink-3); }
.fine { font-size: 0.82rem; color: var(--ink-3); line-height: 1.6; }
.mini-label { font-size: 0.75rem; font-weight: 700; color: var(--ink-3); letter-spacing: 0.04em; }
.mini-title { font-size: 0.85rem; color: var(--ink-2); margin-top: 6px; }
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.panel-title { font-family: var(--font-round); font-size: 1.1rem; }
.meter { display: block; height: 8px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 0.4s ease; }
.page-head { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.page-head h1 { font-family: var(--font-round); font-size: 1.4rem; flex: 1; min-width: 0; }
.ph-spacer { flex: 1; }

/* ---------- 下のメニュー ---------- */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center; gap: 4px;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--card) 94%, transparent);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
.nav-item {
  flex: 1; max-width: 160px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 52px; border-radius: 12px;
  color: var(--ink-3); text-decoration: none;
  font-size: 0.75rem; font-weight: 700;
}
.nav-item .ic { width: 24px; height: 24px; }
.nav-item.is-current { color: var(--accent); background: var(--accent-soft); }

/* ---------- ホーム ---------- */
.home-head { padding-top: 6px; }
.app-title { font-family: var(--font-round); font-size: 1.6rem; font-weight: 700; letter-spacing: 0.02em; }
.tagline { color: var(--ink-2); font-size: 0.92rem; margin-top: 2px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px;
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center;
  min-width: 0;
}
.stat-ic { grid-row: 1 / 3; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
.stat-ic .ic { width: 22px; height: 22px; }
.stat-ic.flame { background: var(--again-soft); color: var(--stamp); }
.stat-ic.star { background: var(--hard-soft); color: var(--hard); }
.stat-ic.target { background: var(--accent-soft); color: var(--accent); }
.stat-num { font-family: var(--font-en); font-weight: 600; font-size: 1.45rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-num small { font-family: var(--font-ja); font-size: 0.8rem; font-weight: 700; color: var(--ink-2); margin-left: 2px; }
.stat-label { font-size: 0.76rem; color: var(--ink-3); font-weight: 700; line-height: 1.4; }
.stat.goal { grid-column: 1 / -1; grid-template-columns: auto 1fr; }
.stat.goal .meter { grid-column: 1 / -1; margin-top: 10px; }
.resume {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 16px; border-radius: var(--radius);
  background: var(--card); border: 2px solid var(--accent);
}
.resume-title { font-weight: 700; }
.resume-sub { font-size: 0.88rem; color: var(--ink-2); }
.mode-card {
  border-radius: var(--radius); padding: 18px 16px;
  background: var(--card); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 12px;
}
.mode-card.main-mode { background: var(--accent-soft); border-color: transparent; }
.mode-head h2 { font-family: var(--font-round); font-size: 1.3rem; }
.mode-sub { display: block; font-size: 0.88rem; color: var(--ink-2); line-height: 1.55; }
.mode-counts { display: flex; gap: 16px; font-size: 0.9rem; color: var(--ink-2); }
.mode-counts b { font-family: var(--font-en); font-size: 1.25rem; color: var(--ink); margin-right: 2px; font-variant-numeric: tabular-nums; }
.sched-list li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.sched-list li:last-child { border-bottom: 0; }
.sched-list b { font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day .dot {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1.5px dashed var(--line);
  font-family: var(--font-en); font-size: 0.8rem; font-weight: 600; color: var(--accent-ink);
}
.day.done .dot { background: var(--accent); border: 0; }
.day.today .dot { outline: 2px solid var(--accent); outline-offset: 2px; }
.day .wd { font-size: 0.72rem; color: var(--ink-3); font-weight: 700; }
.lv-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--paper-2); gap: 2px; }
.lv-seg { display: block; min-width: 6px; }
.lv-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--ink-2); }
.lv-legend li { display: inline-flex; align-items: center; gap: 6px; }
.lv-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--paper-2); border: 1px solid var(--line); }
.lv-new { background: var(--paper-2); }
.lv-learning { background: var(--lv1); }
.lv-reviewing { background: var(--lv2); }
.lv-settled { background: var(--lv3); }
.lv-dot.lv-learning, .lv-dot.lv-reviewing, .lv-dot.lv-settled { border-color: transparent; }
.lv-dot.lv-off { background: transparent; border: 1.5px dashed var(--hard); }
details.panel > summary, details.more > summary { cursor: pointer; font-weight: 700; }
.about p { font-size: 0.9rem; color: var(--ink-2); }

/* ---------- カード学習 ---------- */
.study-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0; background: var(--desk);
}
.progress { flex: 1; height: 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.35s ease; }
.remain { font-size: 0.85rem; color: var(--ink-2); white-space: nowrap; }
.remain b { font-family: var(--font-en); font-size: 1.15rem; color: var(--ink); font-variant-numeric: tabular-nums; }

.card {
  position: relative;
  background: var(--card);
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  padding: 14px 18px 20px;
  display: flex; flex-direction: column; gap: 16px;
  animation: card-in 0.22s ease-out;
}
@keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card-top { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 12px; border-bottom: 2px solid var(--margin-line); margin: 0 -2px; }
.card-front {
  min-height: clamp(380px, 60vh, 560px);
  cursor: pointer;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 35px, var(--rule) 36px);
  background-position: 0 60px;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
.card-front.rev { background-image: none; }
.card-front:active { transform: scale(0.995); }
.front-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.headword {
  font-family: var(--font-en);
  font-weight: 600;
  font-size: clamp(2.8rem, 14vw, 4.2rem);
  line-height: 1.1;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}
.headword.sm { font-size: clamp(2rem, 9vw, 2.6rem); }
.ipa { font-family: var(--font-ipa); color: var(--ink-2); font-size: 1.05rem; }
.speak-note { font-size: 0.82rem; color: var(--ink-3); }
.cue-box {

<script>
/*
 * util.js — 日付・文字列などの小さな共通処理
 * ブラウザでは window.CIF.util、Node（テスト）では require() で使う。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.CIF = root.CIF || {};
    root.CIF.util = factory();
  }
})(this, function () {
  'use strict';

  const MINUTE = 60 * 1000;
  const DAY = 24 * 60 * MINUTE;

  /** その日の 0:00（端末のタイムゾーン）のタイムスタンプ */
  function startOfDay(ts) {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  /** ts の日の 0:00 から n 日後の 0:00（夏時間でもずれない） */
  function addDays(ts, n) {
    const d = new Date(startOfDay(ts));
    d.setDate(d.getDate() + n);
    return d.getTime();
  }

  /** 'YYYY-MM-DD'（端末のタイムゾーン） */
  function dayKey(ts) {
    const d = new Date(ts);
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  /** 'YYYY-MM-DD' → その日の 0:00 */
  function parseDayKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  }

  /** 2つの日付の「日数の差」（カレンダー上） */
  function daysBetween(fromTs, toTs) {
    return Math.round((startOfDay(toTs) - startOfDay(fromTs)) / DAY);
  }

  /** 復習予定を「今日」「明日」「3日後」「11/12」のように表す */
  function formatDue(due, now) {
    if (!due) return '未定';
    if (due <= now) return '今すぐ';
    const diffMin = Math.round((due - now) / MINUTE);
    if (startOfDay(due) === startOfDay(now)) {
      if (diffMin < 60) return diffMin + '分後';
      return '今日 ' + Math.round(diffMin / 60) + '時間後';
    }
    const days = daysBetween(now, due);
    if (days === 1) return '明日';
    if (days < 7) return days + '日後';
    const d = new Date(due);
    return (d.getMonth() + 1) + '/' + d.getDate() + '（' + days + '日後）';
  }

  /** 「11月4日」のような短い日付 */
  function formatDate(ts) {
    const d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function formatDateTime(ts) {
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
  }

  /** HTML に入れる文字列のエスケープ */
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /**
   * 例文の [ ] で囲んだ部分（その用法の単語）を取り出す。
   * "I'm [pretty] tired." → [{t:"I'm "}, {t:"pretty", hit:true}, {t:" tired."}]
   */
  function parseMarked(text) {
    const parts = [];
    const re = /\[([^\]]+)\]/g;
    let last = 0;
    let m;
    const s = String(text || '');
    while ((m = re.exec(s))) {
      if (m.index > last) parts.push({ t: s.slice(last, m.index) });
      parts.push({ t: m[1], hit: true });
      last = re.lastIndex;
    }
    if (last < s.length) parts.push({ t: s.slice(last) });
    return parts;
  }

  /** 読み上げ用に [ ] を外した文 */
  function plainSentence(text) {
    return String(text || '').replace(/\[([^\]]+)\]/g, '$1');
  }

  /** 例文の [ ] の部分を強調した HTML */
  function markedHtml(text) {
    return parseMarked(text)
      .map((p) => (p.hit ? '<mark class="hit">' + esc(p.t) + '</mark>' : esc(p.t)))
      .join('');
  }

  /** 例文の [ ] の部分を空欄にした HTML（場面→英語の練習用） */
  function clozeHtml(text) {
    return parseMarked(text)
      .map((p) => (p.hit ? '<span class="blank" aria-label="空欄">＿＿＿</span>' : esc(p.t)))
      .join('');
  }

  /** ID に使える短いランダム文字列 */
  function randomId(prefix) {
    const r = Math.random().toString(36).slice(2, 8);
    const t = Date.now().toString(36).slice(-4);
    return (prefix || 'id') + '-' + t + r;
  }

  /** 英単語から ID 用の文字列を作る */
  function slug(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 24) || 'word';
  }

  function clone(obj) {
    return obj == null ? obj : JSON.parse(JSON.stringify(obj));
  }

  /** 配列を並べ替えた新しい配列（rng を渡すとテストで再現できる） */
  function shuffle(arr, rng) {
    const a = arr.slice();
    const rand = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  return {
    MINUTE, DAY, startOfDay, addDays, dayKey, parseDayKey, daysBetween,
    formatDue, formatDate, formatDateTime, esc, parseMarked, plainSentence,
    markedHtml, clozeHtml, randomId, slug, clone, shuffle,
  };
});

<script>
/*
 * srs.js — 復習間隔（間隔反復）の計算
 *
 * 3段階の自己評価：
 *   again = 思い出せなかった → 10分後に再出題（セットの中でもすぐもう一度）
 *   hard  = あいまい         → 間隔を半分に（最短で翌日）
 *   good  = 思い出せた       → 間隔を広げる（1日 → 3日 → 約8日 → …）
 *
 * 1回答えられただけでは「定着」にしない。間隔が21日以上かつ
 * 3回続けて思い出せたときに、ようやく「定着してきた」と表示する。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('./util.js'));
  } else {
    root.CIF = root.CIF || {};
    root.CIF.srs = factory(root.CIF.util);
  }
})(this, function (util) {
  'use strict';

  const RATINGS = ['again', 'hard', 'good'];
  const RATING_LABEL = { again: '思い出せなかった', hard: 'あいまい', good: '思い出せた' };
  const AGAIN_DELAY = 10 * util.MINUTE;
  const MAX_INTERVAL = 365;
  const MIN_EASE = 1.3;
  const START_EASE = 2.5;
  const HISTORY_LIMIT = 40;

  function newState() {
    return { reps: 0, lapses: 0, streak: 0, interval: 0, ease: START_EASE, due: 0, last: 0, history: [] };
  }

  /** 次の間隔（日数）。0 は「同じ日のうちにもう一度」 */
  function nextInterval(state, rating, now) {
    const s = state || newState();
    if (rating === 'again') return 0;
    if (rating === 'hard') {
      if (s.interval < 1) return 1;
      return Math.max(1, Math.round(s.interval / 2));
    }
    // good
    if (isEarly(s, now)) return s.interval; // 予定より前の復習では間隔を伸ばさない
    if (s.interval < 1) return 1;
    if (s.interval === 1) return 3;
    return Math.min(MAX_INTERVAL, Math.max(s.interval + 1, Math.round(s.interval * s.ease)));
  }

  /** 復習予定日より前に解いているか（同じ日の再出題は除く） */
  function isEarly(state, now) {
    return !!state && state.interval >= 1 && state.due > now;
  }

  /**
   * そのセットで初めて答えたときの更新。
   * 返り値は新しい状態（元の state は変更しない）。
   */
  function review(state, rating, now) {
    if (!RATINGS.includes(rating)) throw new Error('unknown rating: ' + rating);
    const prev = state || newState();
    const s = util.clone(prev);
    s.history = Array.isArray(s.history) ? s.history : [];
    const early = isEarly(prev, now);
    const ivl = nextInterval(prev, rating, now);

    if (rating === 'again') {
      if (prev.reps > 0) s.lapses += 1;
      s.streak = 0;
      s.ease = Math.max(MIN_EASE, round2(s.ease - 0.2));
      s.interval = 0;
      s.due = now + AGAIN_DELAY;
    } else if (rating === 'hard') {
      s.ease = Math.max(MIN_EASE, round2(s.ease - 0.15));
      s.interval = ivl;
      s.due = util.addDays(now, ivl);
      if (early) s.due = Math.min(prev.due, s.due);
    } else {
      if (early) {
        // 予定は変えない（前倒しで当たっても間隔は伸ばさない）
        s.interval = prev.interval;
        s.due = prev.due;
      } else {
        s.streak += 1;
        s.interval = ivl;
        s.due = util.addDays(now, ivl);
      }
    }
    s.reps += 1;
    s.last = now;
    s.history.push({ t: now, r: rating, ivl: s.interval });
    if (s.history.length > HISTORY_LIMIT) s.history = s.history.slice(-HISTORY_LIMIT);
    return s;
  }

  /**
   * 同じセット内で再出題したときの記録。予定は変えず、履歴だけ残す。
   * （「あいまい」で再出題 → 「思い出せた」でも、間隔を2回伸ばさないため）
   */
  function recordRepeat(state, rating, now) {
    const s = util.clone(state || newState());
    s.history = Array.isArray(s.history) ? s.history : [];
    s.history.push({ t: now, r: rating, re: true });
    if (s.history.length > HISTORY_LIMIT) s.history = s.history.slice(-HISTORY_LIMIT);
    if (rating === 'again') {
      // 見直した直後でも思い出せない → 今日のうちにもう一度出す
      s.interval = 0;
      s.streak = 0;
      s.due = now + AGAIN_DELAY;
    }
    return s;
  }

  /** ボタンの下に出す「次はいつ」 */
  function previewLabel(state, rating, now) {
    if (rating === 'again') return '10分後';
    const s = state || newState();
    if (rating === 'good' && isEarly(s, now)) return '予定どおり';
    const ivl = nextInterval(s, rating, now);
    if (ivl === 1) return '明日';
    return ivl + '日後';
  }

  function isDue(state, now) {
    return !!state && state.reps > 0 && state.due <= now;
  }

  /** 習得度。「完全習得」とは言わない */
  const LEVELS = {
    new: { key: 'new', label: '未学習', order: 0 },
    learning: { key: 'learning', label: '覚えはじめ', order: 1 },
    reviewing: { key: 'reviewing', label: '復習中', order: 2 },
    settled: { key: 'settled', label: '定着してきた', order: 3 },
  };

  function level(state) {
    if (!state || !state.reps) return LEVELS.new;
    if (state.interval < 3) return LEVELS.learning;
    if (state.interval >= 21 && state.streak >= 3) return LEVELS.settled;
    return LEVELS.reviewing;
  }

  function round2(n) {
    return Math.round(n * 100) / 100;
  }

  return {
    RATINGS, RATING_LABEL, AGAIN_DELAY, LEVELS,
    newState, nextInterval, isEarly, review, recordRepeat, previewLabel, isDue, level,
  };
});

</script>
<script>
/*
 * session.js — 1セット（基本10枚）の組み立てと、回答ごとの進め方
 *
 * 出題の優先順：
 *   1. 復習予定日を過ぎたカード（遅れている順）
 *   2. まだ学習していないカード
 *   3. それでも足りなければ、復習予定が近いカード（前倒し）
 * セット内では「思い出せなかった」は3枚後、「あいまい」は5枚後にもう一度出す。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('./util.js'), require('./srs.js'));
  } else {
    root.CIF = root.CIF || {};
    root.CIF.session = factory(root.CIF.util, root.CIF.srs);
  }
})(this, function (util, srs) {
  'use strict';

  const SET_SIZE = 10;
  const MODES = {
    fwd: { key: 'fwd', label: '英語 → 場面', long: '英単語を見て・聞いて、場面と感覚を思い出す' },
    rev: { key: 'rev', label: '場面 → 英語', long: '場面や短い説明から、英単語を思い出す' },
  };
  const POINTS = { good: 10, hard: 6, again: 3, repeat: 1, setBonus: 20, goalBonus: 30 };
  const REQUEUE = {
    again: { gap: 3, max: 3 },
    hard: { gap: 5, max: 1 },
  };

  /** 「要確認」を除いた、出題してよい用法の一覧 */
  function studyable(words) {
    const out = [];
    (words || []).forEach((w) => {
      if (!w || w.status === 'needs_review') return;
      (w.senses || []).forEach((s) => {
        if (!s || s.status === 'needs_review') return;
        out.push({ word: w, sense: s });
      });
    });
    return out;
  }

  function stateOf(progress, senseId, mode) {
    const p = progress && progress[senseId];
    return (p && p[mode]) || null;
  }

  /** 逆向き（場面→英語）に出せるのは、英語→場面で一度でも学習した用法だけ */
  function eligible(item, progress, mode) {
    if (mode === 'fwd') return true;
    const f = stateOf(progress, item.sense.id, 'fwd');
    const hasCue = !!(item.sense.nuance || (item.sense.scene && item.sense.scene.text));
    return !!(f && f.reps > 0 && hasCue);
  }

  function pickCards(words, progress, mode, now, size) {
    const items = studyable(words).filter((it) => eligible(it, progress, mode));
    const due = [];
    const fresh = [];
    const later = [];
    items.forEach((it, index) => {
      const st = stateOf(progress, it.sense.id, mode);
      if (!st || !st.reps) fresh.push({ it, index });
      else if (st.due <= now) due.push({ it, st });
      else later.push({ it, st });
    });
    due.sort((a, b) => a.st.due - b.st.due || b.st.lapses - a.st.lapses);
    later.sort((a, b) => a.st.due - b.st.due);
    const picked = [];
    const early = {};
    due.forEach((d) => picked.length < size && picked.push(d.it.sense.id));
    fresh.forEach((f) => picked.length < size && picked.push(f.it.sense.id));
    later.forEach((l) => {
      if (picked.length < size) {
        picked.push(l.it.sense.id);
        early[l.it.sense.id] = true;
      }
    });
    return { ids: spreadSameWord(picked, words), early };
  }

  /** 同じ単語のカードが続かないように、できる範囲で並べ替える */
  function spreadSameWord(ids, words) {
    const owner = {};
    (words || []).forEach((w) => (w.senses || []).forEach((s) => (owner[s.id] = w.id)));
    const rest = ids.slice();
    const out = [];
    while (rest.length) {
      const prevOwner = out.length ? owner[out[out.length - 1]] : null;
      let i = rest.findIndex((id) => owner[id] !== prevOwner);
      if (i < 0) i = 0;
      out.push(rest.splice(i, 1)[0]);
    }
    return out;
  }

  function build(words, progress, mode, now, opts) {
    const size = (opts && opts.size) || SET_SIZE;
    const { ids, early } = pickCards(words, progress, mode, now, size);
    if (!ids.length) return null;
    return {
      id: util.randomId('set'),
      mode,
      createdAt: now,
      updatedAt: now,
      cards: ids.slice(),
      queue: ids.slice(),
      early,
      results: {},
      answered: 0,
      points: 0,
      flipped: false,
      finished: false,
      goalReached: false,
    };
  }

  function current(session) {
    return session && session.queue.length ? session.queue[0] : null;
  }

  function remaining(session) {
    return session ? session.queue.length : 0;
  }

  /** 進捗バー用（再出題で分母が増える） */
  function progressRatio(session) {
    if (!session) return 0;
    const total = session.answered + session.queue.length;
    return total ? session.answered / total : 1;
  }

  /**
   * 回答を反映する。session / progress は書き換えずに新しいものを返す。
   * 戻り値: { session, progress, event }
   */
  function answer(session, progress, rating, now) {
    if (!srs.RATINGS.includes(rating)) throw new Error('unknown rating');
    const sid = current(session);
    if (!sid) throw new Error('no current card');
    const s = util.clone(session);
    const p = Object.assign({}, progress);
    const mode = s.mode;
    const entry = Object.assign({}, p[sid] || {});
    const result = s.results[sid] || { first: null, answers: [], repeats: 0 };
    const isFirst = result.first === null;
    let points;

    if (isFirst) {
      entry[mode] = srs.review(entry[mode], rating, now);
      result.first = rating;
      points = POINTS[rating];
    } else {
      entry[mode] = srs.recordRepeat(entry[mode], rating, now);
      points = POINTS.repeat;
    }
    result.answers = result.answers.concat(rating);
    result.nextDue = entry[mode].due;
    p[sid] = entry;

    s.queue.shift();
    const rule = REQUEUE[rating];
    const mayRepeat = rule && result.repeats < rule.max && (rating === 'again' || isFirst);
    if (mayRepeat) {
      const at = Math.min(rule.gap, s.queue.length);
      s.queue.splice(at, 0, sid);
      result.repeats += 1;
    }
    s.results[sid] = result;
    s.answered += 1;
    s.points += points;
    s.flipped = false;
    s.updatedAt = now;
    if (!s.queue.length) s.finished = true;

    return {
      session: s,
      progress: p,
      event: { senseId: sid, rating, first: isFirst, points, requeued: !!mayRepeat, finished: s.finished },
    };
  }

  /** 保存してあったセットを再開できる形に整える（削除された単語を除く） */
  function sanitize(session, words) {
    if (!session || !Array.isArray(session.queue)) return null;
    const ids = new Set();
    studyable(words).forEach((it) => ids.add(it.sense.id));
    const s = util.clone(session);
    s.queue = s.queue.filter((id) => ids.has(id));
    s.cards = (s.cards || []).filter((id) => ids.has(id));
    s.results = s.results || {};
    s.flipped = !!s.flipped;
    if (!s.queue.length) s.finished = true;
    return s;
  }

  function summary(session) {
    const out = { good: 0, hard: 0, again: 0, cards: 0, repeats: 0 };
    if (!session) return out;
    Object.keys(session.results).forEach((id) => {
      const r = session.results[id];
      if (r.first) {
        out[r.first] += 1;
        out.cards += 1;
      }
      out.repeats += Math.max(0, r.answers.length - 1);
    });
    return out;
  }

  /** ホーム画面用の件数 */
  function counts(words, progress, now) {
    const items = studyable(words);
    const res = {
      total: items.length,
      dueFwd: 0, newFwd: 0, dueRev: 0, availableRev: 0, newRev: 0,
      tomorrow: 0, week: 0, levels: { new: 0, learning: 0, reviewing: 0, settled: 0 },
    };
    const tomorrowEnd = util.addDays(now, 2);
    const weekEnd = util.addDays(now, 8);
    items.forEach((it) => {
      const f = stateOf(progress, it.sense.id, 'fwd');
      const r = stateOf(progress, it.sense.id, 'rev');
      res.levels[srs.level(f).key] += 1;
      if (!f || !f.reps) res.newFwd += 1;
      else if (f.due <= now) res.dueFwd += 1;
      if (eligible(it, progress, 'rev')) {
        res.availableRev += 1;
        if (!r || !r.reps) res.newRev += 1;
        else if (r.due <= now) res.dueRev += 1;
      }
      [f, r].forEach((st) => {
        if (!st || !st.reps || st.due <= now) return;
        if (st.due < tomorrowEnd && st.due >= util.addDays(now, 1)) res.tomorrow += 1;
        if (st.due < weekEnd) res.week += 1;
      });
    });
    return res;
  }

  /* ---------- 学習記録（日ごと）・ポイント・連続日数 ---------- */

  function emptyLog() {
    return { days: {}, totalPoints: 0 };
  }

  function day(log, now) {
    const key = util.dayKey(now);
    if (!log.days[key]) log.days[key] = { cards: 0, answers: 0, good: 0, hard: 0, again: 0, points: 0, sets: 0 };
    return log.days[key];
  }

  /** 1回の回答を日ごとの記録に足す。目標に届いたらボーナスを返す */
  function logAnswer(log, event, now, dailyGoal) {
    const l = util.clone(log || emptyLog());
    const d = day(l, now);
    const before = d.cards;
    d.answers += 1;
    d.points += event.points;
    l.totalPoints += event.points;
    let bonus = 0;
    if (event.first) {
      d.cards += 1;
      d[event.rating] += 1;
      if (dailyGoal && before < dailyGoal && d.cards >= dailyGoal) {
        bonus = POINTS.goalBonus;
        d.points += bonus;
        l.totalPoints += bonus;
        d.goalReached = true;
      }
    }
    return { log: l, bonus };
  }

  function logSetComplete(log, now) {
    const l = util.clone(log || emptyLog());
    const d = day(l, now);
    d.sets += 1;
    d.points += POINTS.setBonus;
    l.totalPoints += POINTS.setBonus;
    return { log: l, bonus: POINTS.setBonus };
  }

  /** 連続学習日数（1枚でも学習した日が続いた数）。今日まだなら昨日までで数える */
  function streak(log, now) {
    const days = (log && log.days) || {};
    const studied = (ts) => {
      const d = days[util.dayKey(ts)];
      return !!(d && d.cards > 0);
    };
    const todayDone = studied(now);
    let cursor = todayDone ? now : util.addDays(now, -1);
    let n = 0;
    while (studied(cursor)) {
      n += 1;
      cursor = util.addDays(cursor, -1);
      if (n > 3650) break;
    }
    return { days: n, todayDone };
  }

  function today(log, now) {
    const d = log && log.days && log.days[util.dayKey(now)];
    return d || { cards: 0, answers: 0, good: 0, hard: 0, again: 0, points: 0, sets: 0 };
  }

  /** 直近 n 日の学習枚数（古い順） */
  function recentDays(log, now, n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const ts = util.addDays(now, -i);
      const d = log && log.days && log.days[util.dayKey(ts)];
      out.push({ ts, key: util.dayKey(ts), cards: d ? d.cards : 0 });
    }
    return out;
  }

  return {
    SET_SIZE, MODES, POINTS, REQUEUE,
    studyable, stateOf, eligible, pickCards, build, current, remaining, progressRatio,
    answer, sanitize, summary, counts,
    emptyLog, logAnswer, logSetComplete, streak, today, recentDays,
  };
});

</script>
<script>
/*
 * storage.js — 保存・読み込み・書き出し・データの整形
 *
 * 保存先（backend）は差し替えられる：
 *   - local  : ブラウザの localStorage（通常はこれ）
 *   - memory : 保存できない環境での一時保存（再読み込みで消える → 画面で警告）
 *   - その他 : window.CIF.extraBackend が用意されていればそれを優先（公開ページ版など）
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('./util.js'));
  } else {
    root.CIF = root.CIF || {};
    root.CIF.storage = factory(root.CIF.util);
  }
})(this, function (util) {
  'use strict';

  const PREFIX = 'cif.v1.';
  const KEYS = ['words', 'progress', 'log', 'settings', 'session', 'meta'];
  const FORMAT = 'core-image-flashcards';
  const FORMAT_VERSION = 1;

  const STATUS = {
    verified: { key: 'verified', label: '確認済み', desc: '辞書などで確認した内容。出典を記録しています。' },
    unverified: { key: 'unverified', label: '未確認', desc: '自分で入力した内容など。出題はしますが、辞書での確認はまだです。' },
    needs_review: { key: 'needs_review', label: '要確認', desc: '読めない文字や意図が不明な点があるため、通常の出題から外しています。' },
  };

  const POS = {
    noun: '名詞', verb: '動詞', adjective: '形容詞', adverb: '副詞',
    preposition: '前置詞', interjection: '間投詞', conjunction: '接続詞', pronoun: '代名詞', other: 'その他',
  };

  const ROLE = {
    thing: 'もの・こと', action: '動き', state: '状態', change: '変化（〜になる）',
    quality: 'どんな（様子）', manner: 'どんなふうに', degree: 'どのくらい',
    relation: '位置・関係', connector: '気持ち・話のつなぎ',
  };

  const GROUPS = ['A', 'B', 'C', 'D'];

  const DEFAULT_SETTINGS = {
    voiceURI: '',
    rate: 0.95,
    slowRate: 0.6,
    dailyGoal: 10,
    accent: 'us',
    autoplay: false,
  };

  /* ---------- 保存先 ---------- */

  function localBackend(storage) {
    const ls = storage || (typeof localStorage !== 'undefined' ? localStorage : null);
    // 書き込めるか試す（プライベートモード等で例外になることがある）
    ls.setItem(PREFIX + '_probe', '1');
    ls.removeItem(PREFIX + '_probe');
    return {
      name: 'local',
      persistent: true,
      async load(key) {
        const raw = ls.getItem(PREFIX + key);
        return raw == null ? undefined : JSON.parse(raw);
      },
      async save(key, value) {
        if (value === undefined || value === null) ls.removeItem(PREFIX + key);
        else ls.setItem(PREFIX + key, JSON.stringify(value));
      },
      saveSync(key, value) {
        if (value === undefined || value === null) ls.removeItem(PREFIX + key);
        else ls.setItem(PREFIX + key, JSON.stringify(value));
      },
    };
  }

  function memoryBackend() {
    const mem = {};
    return {
      name: 'memory',
      persistent: false,
      async load(key) {
        return mem[key] === undefined ? undefined : util.clone(mem[key]);
      },
      async save(key, value) {
        mem[key] = util.clone(value);
      },
    };
  }

  async function pickBackend() {
    const g = typeof window !== 'undefined' ? window : {};
    if (g.CIF && typeof g.CIF.extraBackend === 'function') {
      try {
        const b = await g.CIF.extraBackend();
        if (b) return b;
      } catch (e) {
        /* 使えなければ localStorage へ */
      }
    }
    try {
      return localBackend();
    } catch (e) {
      return memoryBackend();
    }
  }

  /* ---------- ストア（画面からはこれを使う） ---------- */

  function createStore(backend) {
    const state = { words: [], progress: {}, log: null, settings: null, session: null, meta: {} };
    const status = { backend: backend.name, persistent: backend.persistent, error: '' };
    const pending = {};
    const writing = {};
    const listeners = [];

    function notify() {
      listeners.forEach((fn) => {
        try { fn(status); } catch (e) { /* noop */ }
      });
    }

    async function flush(key) {
      if (writing[key]) return;
      writing[key] = true;
      try {
        while (Object.prototype.hasOwnProperty.call(pending, key)) {
          const value = pending[key];
          delete pending[key];
          await backend.save(key, value);
        }
        if (status.error) {
          status.error = '';
          notify();
        }
      } catch (e) {
        status.error = saveErrorMessage(e);
        notify();
      } finally {
        writing[key] = false;
      }
    }

    function persist(key) {
      const value = state[key];
      if (backend.saveSync) {
        try {
          backend.saveSync(key, value);
          if (status.error) {
            status.error = '';
            notify();
          }
        } catch (e) {
          status.error = saveErrorMessage(e);
          notify();
        }
        return Promise.resolve();
      }
      pending[key] = util.clone(value);
      return flush(key);
    }

    return {
      state,
      status,
      onStatus(fn) { listeners.push(fn); },
      async init(seed) {
        const loaded = {};
        for (const key of KEYS) {
          try {
            loaded[key] = await backend.load(key);
          } catch (e) {
            loaded[key] = undefined;
            status.error = '保存データの一部を読み込めませんでした（' + key + '）。';
          }
        }
        const meta = loaded.meta && typeof loaded.meta === 'object' ? loaded.meta : {};
        let words;
        if (Array.isArray(loaded.words)) {
          words = loaded.words.map((w) => normalizeWord(w).word).filter(Boolean);
          const merged = mergeNewSeedWords(words, seed, meta);
          words = merged.words;
          if (merged.added) loaded._wordsChanged = true;
        } else {
          words = (seed ? seed.words : []).map((w) => normalizeWord(w).word);
          meta.seedVersion = seed ? seed.version : 0;
          loaded._wordsChanged = true;
        }
        state.words = words;
        state.progress = normalizeProgress(loaded.progress);
        state.log = normalizeLog(loaded.log);
        state.settings = normalizeSettings(loaded.settings);
        state.session = loaded.session && typeof loaded.session === 'object' ? loaded.session : null;
        state.meta = Object.assign({ deletedSeed: [] }, meta, { seedVersion: seed ? seed.version : meta.seedVersion || 0 });
        if (loaded._wordsChanged) {
          persist('words');
          persist('meta');
        }
        return state;
      },
      set(key, value) {
        if (!KEYS.includes(key)) throw new Error('unknown key ' + key);
        state[key] = value;
        return persist(key);
      },
      setMany(obj) {
        return Promise.all(Object.keys(obj).map((k) => this.set(k, obj[k])));
      },
    };
  }

  function saveErrorMessage(e) {
    const name = e && (e.name || e.code);
    if (name === 'QuotaExceededError' || name === 'quota_exceeded' || name === 'NS_ERROR_DOM_QUOTA_REACHED') {
      return '保存できる容量がいっぱいです。不要な単語を削除するか、データを書き出してください。';
    }
    return '学習データを保存できませんでした。ブラウザの設定（プライベートモードなど）を確認してください。';
  }

  /** 新しいバージョンで増えた初期単語を追加（ユーザーが削除したものは戻さない） */
  function mergeNewSeedWords(words, seed, meta) {
    if (!seed || !(seed.version > (meta.seedVersion || 0))) return { words, added: 0 };
    const have = new Set(words.map((w) => w.id));
    const deleted = new Set(meta.deletedSeed || []);
    const add = seed.words.filter((w) => !have.has(w.id) && !deleted.has(w.id)).map((w) => normalizeWord(w).word);
    return { words: words.concat(add), added: add.length };
  }

  /* ---------- データの整形・チェック ---------- */

  const MAX_TEXT = 2000;
  const REPLACEMENT = /�/;
  const HEADWORD_OK = /^[A-Za-z][A-Za-z '’.\-]*$/;

  function str(v, max) {
    if (v == null) return '';
    const s = typeof v === 'string' ? v : typeof v === 'number' ? String(v) : '';
    return s.trim().slice(0, max || MAX_TEXT);
  }

  function safeUrl(v) {
    const s = str(v, 500);
    if (!s) return '';
    if (/^https?:\/\//i.test(s)) return s;
    // 同じフォルダの録音ファイル（audio/xxx.mp3 など）も許可
    if (/^[\w\-./]+\.(mp3|m4a|aac|wav|ogg|oga|webm)$/i.test(s) && !s.includes('..')) return s;
    return '';
  }

  function safeId(v, prefix, fallbackText) {
    const s = str(v, 64);
    if (/^[A-Za-z0-9][A-Za-z0-9-]*$/.test(s)) return s;
    return util.randomId(prefix + '-' + util.slug(fallbackText));
  }

  function hasBrokenText(obj) {
    return REPLACEMENT.test(JSON.stringify(obj || ''));
  }

  /**
   * 単語データを安全な形にそろえる。
   * 見出し語が英字でない・文字化けがある・意味が空 などは「要確認」にして理由を残す。
   */
  function normalizeWord(raw) {
    if (!raw || typeof raw !== 'object') return { word: null, problems: ['データの形が正しくありません'] };
    const problems = [];
    const headword = str(raw.headword, 60);
    const w = {
      id: safeId(raw.id, 'w', headword),
      headword,
      status: STATUS[raw.status] ? raw.status : 'unverified',
      check: {
        date: str(raw.check && raw.check.date, 20),
        method: str(raw.check && raw.check.method),
        note: str(raw.check && raw.check.note),
      },
      sources: Array.isArray(raw.sources)
        ? raw.sources
            .map((s) => ({ label: str(s && s.label, 200), url: safeUrl(s && s.url) }))
            .filter((s) => s.label || s.url)
            .slice(0, 10)
        : [],
      groups: {},
      senses: [],
      reviewReasons: [],
      createdAt: Number(raw.createdAt) || 0,
      updatedAt: Number(raw.updatedAt) || 0,
    };
    if (raw.groups && typeof raw.groups === 'object') {
      GROUPS.forEach((g) => {
        const t = str(raw.groups[g], 300);
        if (t) w.groups[g] = t;
      });
    }
    const seenIds = new Set();
    (Array.isArray(raw.senses) ? raw.senses : []).slice(0, 12).forEach((s) => {
      const sense = normalizeSense(s, headword);
      if (!sense) return;
      if (seenIds.has(sense.id)) sense.id = util.randomId('s-' + util.slug(headword));
      seenIds.add(sense.id);
      w.senses.push(sense);
    });

    if (!headword) problems.push('見出し語がありません');
    else if (REPLACEMENT.test(headword)) problems.push('見出し語に読めない文字（�）があります');
    else if (!HEADWORD_OK.test(headword)) problems.push('見出し語に英字以外の文字が含まれています');
    if (!w.senses.length) problems.push('意味・用法が登録されていません');
    if (hasBrokenText(raw.senses)) problems.push('説明や例文に読めない文字（�）があります');
    if (problems.length) {
      w.status = 'needs_review';
      w.reviewReasons = problems;
    } else if (Array.isArray(raw.reviewReasons) && raw.status === 'needs_review') {
      w.reviewReasons = raw.reviewReasons.map((r) => str(r, 200)).filter(Boolean).slice(0, 5);
    }
    return { word: w, problems };
  }

  function normalizeSense(s, headword) {
    if (!s || typeof s !== 'object') return null;
    const sense = {
      id: safeId(s.id, 's', headword),
      group: GROUPS.includes(s.group) ? s.group : 'A',
      pos: POS[s.pos] ? s.pos : 'other',
      role: ROLE[s.role] ? s.role : '',
      cue: str(s.cue, 120),
      speak: str(s.speak, 120),
      ipa: { us: str(s.ipa && s.ipa.us, 60), uk: str(s.ipa && s.ipa.uk, 60) },
      stress: str(s.stress, 60),
      nuance: str(s.nuance, 200),
      scene: {
        emoji: str(s.scene && s.scene.emoji, 16),
        diagram: str(s.scene && s.scene.diagram, 40),
        text: str(s.scene && s.scene.text, 300),
      },
      meaning: str(s.meaning, 200),
      roleText: str(s.roleText, 600),
      examples: (Array.isArray(s.examples) ? s.examples : [])
        .map((e) => ({ en: str(e && e.en, 300), ja: str(e && e.ja, 300) }))
        .filter((e) => e.en)
        .slice(0, 6),
      contrasts: (Array.isArray(s.contrasts) ? s.contrasts : [])
        .map((c) => ({ word: str(c && c.word, 60), text: str(c && c.text, 400) }))
        .filter((c) => c.word || c.text)
        .slice(0, 6),
      note: str(s.note, 600),
      status: s.status === 'needs_review' ? 'needs_review' : '',
      audio: {
        word: safeUrl(s.audio && s.audio.word),
        examples: (s.audio && Array.isArray(s.audio.examples) ? s.audio.examples : []).map(safeUrl).slice(0, 6),
      },
    };
    if (!sense.meaning) sense.status = 'needs_review';
    return sense;
  }

  function num(v, d) {
    const n = Number(v);
    return Number.isFinite(n) ? n : d;
  }

  function normalizeState(st) {
    if (!st || typeof st !== 'object') return null;
    return {
      reps: Math.max(0, Math.floor(num(st.reps, 0))),
      lapses: Math.max(0, Math.floor(num(st.lapses, 0))),
      streak: Math.max(0, Math.floor(num(st.streak, 0))),
      interval: Math.max(0, Math.min(365, Math.floor(num(st.interval, 0)))),
      ease: Math.max(1.3, Math.min(3.5, num(st.ease, 2.5))),
      due: Math.max(0, num(st.due, 0)),
      last: Math.max(0, num(st.last, 0)),
      history: (Array.isArray(st.history) ? st.history : [])
        .filter((h) => h && ['again', 'hard', 'good'].includes(h.r))
        .map((h) => {
          const e = { t: num(h.t, 0), r: h.r };
          if (h.re) e.re = true;
          if (h.ivl != null) e.ivl = num(h.ivl, 0);
          return e;
        })
        .slice(-40),
    };
  }

  function normalizeProgress(p) {
    const out = {};
    if (!p || typeof p !== 'object') return out;
    Object.keys(p).forEach((id) => {
      if (!/^[A-Za-z0-9][A-Za-z0-9-]*$/.test(id)) return;
      const e = p[id] || {};
      const fwd = normalizeState(e.fwd);
      const rev = normalizeState(e.rev);
      if (fwd || rev) {
        out[id] = {};
        if (fwd) out[id].fwd = fwd;
        if (rev) out[id].rev = rev;
      }
    });
    return out;
  }

  function normalizeLog(l) {
    const out = { days: {}, totalPoints: 0 };
    if (!l || typeof l !== 'object') return out;
    out.totalPoints = Math.max(0, Math.floor(num(l.totalPoints, 0)));
    const days = l.days && typeof l.days === 'object' ? l.days : {};
    Object.keys(days).forEach((k) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const d = days[k] || {};
      out.days[k] = {
        cards: Math.max(0, Math.floor(num(d.cards, 0))),
        answers: Math.max(0, Math.floor(num(d.answers, 0))),
        good: Math.max(0, Math.floor(num(d.good, 0))),
        hard: Math.max(0, Math.floor(num(d.hard, 0))),
        again: Math.max(0, Math.floor(num(d.again, 0))),
        points: Math.max(0, Math.floor(num(d.points, 0))),
        sets: Math.max(0, Math.floor(num(d.sets, 0))),
        goalReached: !!d.goalReached,
      };
    });
    return out;
  }

  function normalizeSettings(s) {
    const out = Object.assign({}, DEFAULT_SETTINGS);
    if (!s || typeof s !== 'object') return out;
    out.voiceURI = str(s.voiceURI, 300);
    out.rate = Math.max(0.5, Math.min(1.3, num(s.rate, DEFAULT_SETTINGS.rate)));
    out.slowRate = Math.max(0.3, Math.min(1, num(s.slowRate, DEFAULT_SETTINGS.slowRate)));
    out.dailyGoal = [10, 20, 30, 40].includes(Number(s.dailyGoal)) ? Number(s.dailyGoal) : DEFAULT_SETTINGS.dailyGoal;
    out.accent = s.accent === 'uk' ? 'uk' : 'us';
    out.autoplay = !!s.autoplay;
    return out;
  }

  /* ---------- 書き出し・読み込み ---------- */

  function buildExport(state, opts) {
    const includeProgress = !opts || opts.includeProgress !== false;
    const data = {
      format: FORMAT,
      version: FORMAT_VERSION,
      exportedAt: new Date().toISOString(),
      words: state.words,
    };
    if (includeProgress) {
      data.progress = state.progress;
      data.log = state.log;
      data.settings = state.settings;
    }
    return data;
  }

  function exportFileName(now) {
    return 'core-image-cards-' + util.dayKey(now || Date.now()).replace(/-/g, '') + '.json';
  }

  /**
   * 読み込むテキストを確認する。
   * 戻り値: { ok, error?, data?, stats?, warnings? }
   */
  function parseImport(text) {
    let json;
    try {
      json = JSON.parse(String(text || '').replace(/^﻿/, ''));
    } catch (e) {
      return { ok: false, error: 'JSON として読み込めませんでした。書き出したファイルをそのまま選んでください。' };
    }
    let rawWords;
    if (Array.isArray(json)) rawWords = json;
    else if (json && Array.isArray(json.words)) rawWords = json.words;
    else return { ok: false, error: '単語データ（words）が見つかりません。' };
    if (json && json.format && json.format !== FORMAT) {
      return { ok: false, error: 'このアプリのデータ形式ではありません（format: ' + str(json.format, 40) + '）。' };
    }
    const warnings = [];
    const words = [];
    const ids = new Set();
    rawWords.slice(0, 2000).forEach((raw, i) => {
      const { word, problems } = normalizeWord(raw);
      if (!word) {
        warnings.push((i + 1) + '件目: 形式が正しくないため読み飛ばしました');
        return;
      }
      if (ids.has(word.id)) word.id = util.randomId('w-' + util.slug(word.headword));
      ids.add(word.id);
      if (problems.length) warnings.push('「' + (word.headword || (i + 1) + '件目') + '」は要確認にしました: ' + problems.join('、'));
      words.push(word);
    });
    const hasProgress = !!(json && !Array.isArray(json) && json.progress);
    const data = {
      words,
      progress: hasProgress ? normalizeProgress(json.progress) : null,
      log: json && json.log ? normalizeLog(json.log) : null,
      settings: json && json.settings ? normalizeSettings(json.settings) : null,
    };
    const stats = {
      words: words.length,
      senses: words.reduce((n, w) => n + w.senses.length, 0),
      needsReview: words.filter((w) => w.status === 'needs_review').length,
      progress: data.progress ? Object.keys(data.progress).length : 0,
      days: data.log ? Object.keys(data.log.days).length : 0,
    };
    return { ok: true, data, stats, warnings };
  }

  /**
   * mode: 'merge'（同じIDは更新・新しい単語は追加。学習記録は今のものを残す）
   *       'replace'（ファイルの内容に置き換える）
   */
  function applyImport(state, data, mode) {
    if (mode === 'replace') {
      return {
        words: data.words,
        progress: data.progress || {},
        log: data.log || { days: {}, totalPoints: 0 },
        settings: data.settings || state.settings,
        session: null,
      };
    }
    const byId = new Map(state.words.map((w) => [w.id, w]));
    data.words.forEach((w) => byId.set(w.id, w));
    const words = Array.from(byId.values());
    const progress = Object.assign({}, state.progress);
    if (data.progress) {
      Object.keys(data.progress).forEach((id) => {
        if (!progress[id]) progress[id] = data.progress[id];
      });
    }
    return { words, progress };
  }

  return {
    PREFIX, KEYS, FORMAT, STATUS, POS, ROLE, GROUPS, DEFAULT_SETTINGS,
    localBackend, memoryBackend, pickBackend, createStore,
    normalizeWord, normalizeSense, normalizeProgress, normalizeLog, normalizeSettings,
    buildExport, exportFileName, parseImport, applyImport, safeUrl,
  };
});

</script>
<script>
/*
 * data-seed.js — 初期の単語データ（11語・21用法）
 *
 * 1カード = 1つの意味・用法（sense）。
 * 例文の [ ] は、その用法の単語（変化した形を含む）を示す。
 *   - 英語→場面では強調表示、場面→英語では空欄になる。
 * group … 関連する用法のまとまり。グループが違う用法は「別の単語」として扱い、
 *         無理に1つのイメージへ結びつけない（well の「上手に」と「井戸」など）。
 * speak … 単語ボタンで読み上げる文字列。品詞で発音が変わる語（record, live）は、
 *         その用法の発音になるよう短い語句で読み上げる。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.CIF = root.CIF || {};
    root.CIF.seed = factory();
  }
})(this, function () {
  'use strict';

  const CHECKED = '2026-11-04';
  const METHOD =
    'Web検索で表示された辞書の該当ページ（Oxford Learner\'s Dictionaries など）の情報と照らし合わせ、品詞・意味・発音記号を確認しました。' +
    '作成環境からは辞書サイトの本文を直接開けなかったため、気になる点は出典リンクから確認してください。';
  const NOTE = '例文・一言ニュアンス・場面の説明は、このアプリ用に作った学習用の文章です。';
  const OXF = 'https://www.oxfordlearnersdictionaries.com/definition/english/';

  function check(extra) {
    return { date: CHECKED, method: METHOD, note: extra ? NOTE + extra : NOTE };
  }

  const words = [
    {
      id: 'w-pretty',
      headword: 'pretty',
      status: 'verified',
      check: check(),
      sources: [
        { label: "Oxford Learner's Dictionaries: pretty（形容詞）", url: OXF + 'pretty_1' },
        { label: 'Merriam-Webster: pretty', url: 'https://www.merriam-webster.com/dictionary/pretty' },
      ],
      groups: {
        A: '同じ pretty から広がった使い方。ただ「かわいい」と「けっこう」のつながりは感じにくいので、別々に覚えて大丈夫です。',
      },
      senses: [
        {
          id: 's-pretty-adj',
          group: 'A',
          pos: 'adjective',
          role: 'quality',
          cue: 'a pretty flower',
          ipa: { uk: '/ˈprɪti/', us: '/ˈprɪti/' },
          stress: 'PRET·ty',
          nuance: '見ていて、ほっと和む「かわいい・きれい」って感じ',
          scene: {
            emoji: '🌷',
            diagram: '',
            text: '道ばたに小さな花が咲いていて、思わず「かわいい」と顔がゆるむ。',
          },
          meaning: 'かわいい、きれいな（見た目が感じよい）',
          roleText:
            '人やものが「どんな見た目か」を表す言葉です（形容詞）。a pretty flower のように「もの」の前に置いたり、It\'s pretty. のように be 動詞のあとに置いたりします。',
          examples: [
            { en: 'What a [pretty] flower!', ja: 'なんてかわいい花！' },
            { en: 'This is a [pretty] little town.', ja: 'ここはこぢんまりとした、きれいな町だ。' },
