/*
 * コアイメージ単語帳 — スタイル
 * テーマ：グラファイト（グレー）× メタリックブルー
 *   地はやわらかいグレー、面は少し明るいグレー、大事なところだけメタリックブルーの光沢。
 * 部品は少なく、どの画面でも同じ形：
 *   青い光沢のボタン（メイン）／縁が青い光沢のボタン（サブ）／一覧の行（›）／切り替え／音声［再生｜ゆっくり］
 */
:root {
  --page: #c9cdd3;
  --page-grad: radial-gradient(140% 520px at 50% -140px, #d5d8dd 0%, rgba(213, 216, 221, 0) 100%);
  --surface: #dfe2e6;
  --surface-2: #d5d9de;
  --surface-3: #c8cdd3;
  --card-top: #e8eaed;
  --glass: rgba(201, 205, 211, 0.86);
  --line: rgba(20, 26, 34, 0.11);
  --line-2: rgba(20, 26, 34, 0.19);
  --ink: #14181d;
  --ink-2: #3a414a;
  --ink-3: #5c636d;
  --on-page: #454c55;
  --accent: #2c5784;
  --accent-2: #7f9fc2;
  --accent-soft: #cbd7e4;
  --accent-ink: #ffffff;
  --metal: linear-gradient(135deg, #9fbddd 0%, #5b88b6 20%, #335f8b 46%, #284f7a 56%, #557fae 76%, #a2bfdd 100%);
  --metal-line: linear-gradient(135deg, #cddcec 0%, #7aa1c9 28%, #3a6794 52%, #6d97c3 76%, #c4d6ea 100%);
  --metal-soft: linear-gradient(135deg, rgba(205, 220, 236, 0.9), rgba(122, 161, 201, 0.55) 45%, rgba(196, 214, 234, 0.9));
  --graphite: linear-gradient(155deg, #3a3f47 0%, #272b31 50%, #1b1e22 100%);
  --on-graphite: #f1f3f6;
  --on-graphite-2: #a5adb7;
  --ng: #ad4741;
  --ng-soft: #f5e8e7;
  --warn: #87682c;
  --warn-soft: #f3ede1;
  --hl: #c4d3e4;
  --lv1: #b2c3d8;
  --lv2: #7493bb;
  --lv3: #2c5784;
  --sky: #c7d3e0;
  --night: #2c3440;
  --moon: #e6dfc4;
  --paper-2: #d2d6db;
  --sheen: rgba(255, 255, 255, 0.32);
  --hi: inset 0 1px 0 rgba(255, 255, 255, 0.42);
  --shadow-1: 0 1px 1px rgba(16, 22, 30, 0.06), 0 3px 10px -2px rgba(16, 22, 30, 0.11);
  --shadow-2: 0 2px 4px rgba(16, 22, 30, 0.08), 0 16px 36px -12px rgba(16, 22, 30, 0.3);
  --shadow-blue: 0 10px 24px -10px rgba(40, 79, 122, 0.55);
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-en: "Source Serif 4", "Source Serif Pro", "Iowan Old Style", Georgia, serif;
  --font-ipa: "Noto Sans", "Lucida Sans Unicode", "Segoe UI", "Arial Unicode MS", sans-serif;
  --r: 20px;
  --r-sm: 14px;
  --nav-h: 64px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #16191d;
    --page-grad: radial-gradient(140% 520px at 50% -140px, #262a30 0%, rgba(38, 42, 48, 0) 100%);
    --surface: #202328;
    --surface-2: #272a30;
    --surface-3: #30343a;
    --card-top: #282c32;
    --glass: rgba(30, 33, 38, 0.86);
    --line: rgba(255, 255, 255, 0.07);
    --line-2: rgba(255, 255, 255, 0.14);
    --ink: #eef1f4;
    --ink-2: #b0b7c0;
    --ink-3: #8a919a;
    --on-page: #8a919a;
    --accent: #93b9e0;
    --accent-2: #4c739d;
    --accent-soft: #1d2835;
    --accent-ink: #0b131c;
    --metal: linear-gradient(135deg, #dce9f7 0%, #98bde3 22%, #6593c2 48%, #5583b3 58%, #93b9e0 80%, #d5e5f5 100%);
    --metal-line: linear-gradient(135deg, #5b7997 0%, #96bce3 35%, #3f6690 62%, #a3c5e8 100%);
    --metal-soft: linear-gradient(135deg, rgba(91, 121, 151, 0.8), rgba(150, 188, 227, 0.5) 45%, rgba(63, 102, 144, 0.8));
    --graphite: linear-gradient(155deg, #2c3138 0%, #202429 52%, #16181b 100%);
    --ng: #e58d87;
    --ng-soft: #36201f;
    --warn: #d6b26f;
    --warn-soft: #30281a;
    --hl: #22314a;
    --lv1: #2b3a50;
    --lv2: #4d6d97;
    --lv3: #93b9e0;
    --sky: #2c3d54;
    --night: #08090c;
    --moon: #cfc49d;
    --paper-2: #262a30;
    --sheen: rgba(255, 255, 255, 0.04);
    --hi: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-2: 0 18px 40px -16px rgba(0, 0, 0, 0.7);
    --shadow-blue: 0 10px 24px -12px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --page: #16191d;
  --page-grad: radial-gradient(140% 520px at 50% -140px, #262a30 0%, rgba(38, 42, 48, 0) 100%);
  --surface: #202328;
  --surface-2: #272a30;
  --surface-3: #30343a;
  --card-top: #282c32;
  --glass: rgba(30, 33, 38, 0.86);
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.14);
  --ink: #eef1f4;
  --ink-2: #b0b7c0;
  --ink-3: #8a919a;
  --on-page: #8a919a;
  --accent: #93b9e0;
  --accent-2: #4c739d;
  --accent-soft: #1d2835;
  --accent-ink: #0b131c;
  --metal: linear-gradient(135deg, #dce9f7 0%, #98bde3 22%, #6593c2 48%, #5583b3 58%, #93b9e0 80%, #d5e5f5 100%);
  --metal-line: linear-gradient(135deg, #5b7997 0%, #96bce3 35%, #3f6690 62%, #a3c5e8 100%);
  --metal-soft: linear-gradient(135deg, rgba(91, 121, 151, 0.8), rgba(150, 188, 227, 0.5) 45%, rgba(63, 102, 144, 0.8));
  --graphite: linear-gradient(155deg, #2c3138 0%, #202429 52%, #16181b 100%);
  --ng: #e58d87;
  --ng-soft: #36201f;
  --warn: #d6b26f;
  --warn-soft: #30281a;
  --hl: #22314a;
  --lv1: #2b3a50;
  --lv2: #4d6d97;
  --lv3: #93b9e0;
  --sky: #2c3d54;
  --night: #08090c;
  --moon: #cfc49d;
  --paper-2: #262a30;
  --sheen: rgba(255, 255, 255, 0.04);
  --hi: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-2: 0 18px 40px -16px rgba(0, 0, 0, 0.7);
  --shadow-blue: 0 10px 24px -12px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}

/* ---------- 基本 ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--page); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--page);
  background-image: var(--page-grad);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--page); z-index: 30; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 600; text-wrap: balance; font-feature-settings: "palt" 1; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
dl, dd { margin: 0; }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
:lang(en) { font-family: var(--font-en); }
.num { font-variant-numeric: tabular-nums; }

.screen {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 26px;
}
.screen.loading { min-height: 60vh; align-items: center; justify-content: center; color: var(--ink-3); }
body[data-route="study"] .screen, body[data-route="test"] .screen { padding-bottom: calc(156px + env(safe-area-inset-bottom, 0px)); padding-top: 6px; gap: 16px; }
body[data-route="edit"] .screen, body[data-route="new-word"] .screen { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
body[data-route="result"] .screen { padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px)); }

/* ---------- 見出し ---------- */
.page-head { display: flex; align-items: center; gap: 4px; min-height: 52px; margin-bottom: -8px; }
.page-head h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.01em; flex: 1; min-width: 0; outline: none; }
.page-head.sub h1 { font-size: 1.12rem; font-weight: 600; text-align: center; letter-spacing: 0.04em; }
.page-head .side { width: 64px; display: flex; flex: none; }
.page-head .side.right { justify-content: flex-end; width: auto; min-width: 64px; margin-left: auto; }
.page-head .btn.text { padding-inline: 8px; }
.home-head { flex-direction: column; align-items: flex-start; gap: 2px; padding-top: 6px; }
.home-head .eyebrow { letter-spacing: 0.08em; }
.lead { font-size: 0.9rem; color: var(--ink-2); line-height: 1.75; }
.lead.center { text-align: center; margin-top: -12px; color: var(--on-page); font-size: 0.82rem; letter-spacing: 0.04em; }
.eyebrow { font-size: 0.76rem; color: var(--on-page); font-weight: 500; letter-spacing: 0.04em; }
.fine { font-size: 0.78rem; color: var(--ink-3); line-height: 1.7; }
.muted { color: var(--ink-3); }

/* ---------- まとまり ---------- */
.section { display: flex; flex-direction: column; gap: 10px; }
.section-title {
  font-size: 0.74rem; font-weight: 600; color: var(--on-page); letter-spacing: 0.14em;
  padding: 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-feature-settings: "palt" 1;
}
.section-title span { font-weight: 500; letter-spacing: 0.04em; }
.group {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--hi), var(--shadow-1);
  padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.group.tight { padding: 0; gap: 0; overflow: hidden; }
.section-note { font-size: 0.78rem; color: var(--on-page); padding: 0 6px; line-height: 1.7; }

/* 一覧の行 */
.list {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--hi), var(--shadow-1);
  overflow: hidden;
}
.row {
  display: flex; align-items: center; gap: 12px;
  min-height: 58px; padding: 13px 18px;
  color: inherit; text-decoration: none;
  background: transparent; border: 0; width: 100%; text-align: left; cursor: pointer;
  position: relative;
}
.row + .row::before, .list > li + li > .row::before { content: ""; position: absolute; top: 0; left: 18px; right: 0; height: 1px; background: var(--line); }
.row:active { background: var(--surface-2); }
.r-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.r-title { font-size: 1rem; font-weight: 500; font-feature-settings: "palt" 1; }
.r-title b { font-weight: 600; }
.r-sub { font-size: 0.79rem; color: var(--ink-3); line-height: 1.55; }
.r-detail { font-size: 0.88rem; color: var(--ink-3); white-space: nowrap; }
.r-detail b { color: var(--ink); font-weight: 600; font-size: 1.05rem; margin-right: 1px; }
.row > .ic { color: var(--ink-3); opacity: 0.55; width: 17px; height: 17px; }
.row.danger .r-title { color: var(--ng); }
.row.action .r-title, .row.accent .r-title { color: var(--accent); font-weight: 600; }
.row.accent::after { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--metal); }
.row.static { cursor: default; }
.row.static:active { background: transparent; }
.row .toggle { flex: 1; }
.row .lv-bar { margin-top: 8px; }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 52px; padding: 12px 22px;
  border-radius: 16px; border: 1px solid transparent;
  font-weight: 600; font-size: 1rem; letter-spacing: 0.04em;
  cursor: pointer; touch-action: manipulation; text-decoration: none;
  transition: transform 0.12s ease, opacity 0.15s ease, background-position 0.4s ease;
  background: var(--surface); color: var(--accent);
  font-feature-settings: "palt" 1;
}
.btn:active { transform: scale(0.985); }
.btn.primary {
  color: var(--accent-ink);
  background: var(--metal);
  background-size: 180% 180%;
  background-position: 0% 40%;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), inset 0 -1px 0 rgba(0, 0, 0, 0.14), var(--shadow-blue);
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.16);
}
.btn.primary:active { background-position: 100% 60%; }
.btn.secondary {
  color: var(--accent);
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--metal-line) border-box;
  box-shadow: var(--shadow-1);
}
.btn.text { background: transparent; color: var(--accent); min-height: 44px; padding: 8px 12px; letter-spacing: 0.02em; }
.btn.text.muted-btn { color: var(--ink-2); }
.btn.danger { background: var(--ng); color: #fff; }
.btn.text.danger { background: transparent; color: var(--ng); }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: 0.9rem; border-radius: 12px; }
.btn[disabled] { opacity: 0.38; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-col { display: flex; flex-direction: column; gap: 10px; }
.btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: inline-grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--ink-2); cursor: pointer;
  box-shadow: var(--shadow-1);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.icon-btn .ic { width: 20px; height: 20px; }

/* 切り替え */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 4px; border-radius: 15px; background: var(--surface-3); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06); }
.seg button {
  min-height: 40px; border: 1px solid transparent; border-radius: 11px; background: transparent;
  color: var(--ink-3); font-weight: 600; font-size: 0.88rem; cursor: pointer; padding: 4px 6px; letter-spacing: 0.03em;
}
.seg button[aria-pressed="true"] {
  color: var(--accent);
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--metal-line) border-box;
  box-shadow: 0 3px 10px -4px rgba(40, 79, 122, 0.45);
}
.select { position: relative; }
.select select {
  width: 100%; min-height: 44px; padding: 8px 36px 8px 14px;
  border-radius: 13px; border: 1px solid var(--line); background: var(--surface);
  font-weight: 600; font-size: 0.9rem; color: var(--ink); appearance: none; -webkit-appearance: none;
  box-shadow: var(--shadow-1);
}
.select::after { content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; border-right: 1.6px solid var(--accent); border-bottom: 1.6px solid var(--accent); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.filters { display: flex; flex-direction: column; gap: 10px; }
.filters.two { display: grid; grid-template-columns: 1fr 1fr; }
.f .select select { background: var(--surface-2); box-shadow: none; padding-right: 36px; font-weight: 600; }

/* 音声［再生｜ゆっくり］ */
.audio-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.audio-wrap.left { align-items: flex-start; }
.audio {
  position: relative;
  display: inline-flex; align-items: stretch;
  border-radius: 999px; border: 1px solid transparent;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--metal-line) border-box;
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.audio button {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 44px; padding: 0 18px;
  border: 0; background: transparent; color: var(--accent);
  font-weight: 600; font-size: 0.9rem; letter-spacing: 0.04em; cursor: pointer; touch-action: manipulation;
  transition: background-color 0.15s ease;
}
.audio button + button { box-shadow: inset 1px 0 0 var(--line-2); }
.audio button .ic { width: 18px; height: 18px; }
.audio button.playing { background: var(--metal); color: var(--accent-ink); box-shadow: none; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.15); }
.audio button[disabled] { color: var(--ink-3); cursor: not-allowed; }
.audio.off { background: var(--surface-2); border-color: var(--line-2); }
.audio.sm button { min-height: 38px; padding: 0 14px; font-size: 0.84rem; }
/* 再生中：押したボタンの中に、音の長さだけ進む線 */
.audio button { position: relative; }
.audio button::after {
  content: ""; position: absolute; left: 16px; right: 16px; bottom: 6px; height: 2px; border-radius: 2px;
  background: currentColor; transform-origin: left center; transform: scaleX(0); opacity: 0; pointer-events: none;
}
.audio.run.timed button.playing::after { opacity: 0.85; animation: audio-prog var(--dur, 1s) linear forwards; }
.audio.run:not(.timed) button.playing::after { opacity: 0.75; animation: audio-pulse 1.2s ease-in-out infinite; }
@keyframes audio-prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes audio-pulse { 0%, 100% { transform: scaleX(0.12); } 50% { transform: scaleX(0.9); } }
.audio-cap { font-size: 0.7rem; color: var(--ink-3); letter-spacing: 0.08em; }
.audio-cap.live { color: var(--accent); font-weight: 600; letter-spacing: 0.04em; }
.speak-one {
  display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid transparent; color: var(--accent); cursor: pointer; flex: none;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--metal-line) border-box;
  box-shadow: var(--shadow-1);
}
.speak-one .ic { width: 17px; height: 17px; }
.speak-one.playing { background: var(--metal); color: var(--accent-ink); }
.speak-one[disabled] { color: var(--ink-3); background: var(--surface-2); border-color: var(--line-2); }

/* ---------- 小さな部品 ---------- */
.chip { display: inline-flex; align-items: center; min-height: 22px; padding: 0 9px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--ng-soft); color: var(--ng); }
.badge { display: inline-flex; align-items: center; padding: 0 8px; border-radius: 999px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; min-height: 20px; }
.st-verified { background: var(--accent-soft); color: var(--accent); }
.st-unverified { background: var(--surface-3); color: var(--ink-2); }
.st-needs_review { background: var(--warn-soft); color: var(--warn); }
.banner { padding: 13px 15px; border-radius: var(--r-sm); font-size: 0.86rem; line-height: 1.65; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.banner.warn { background: var(--warn-soft); color: var(--ink); border-color: transparent; }
.banner.info { background: var(--surface); }
.banner ul { list-style: disc; padding-left: 1.2em; margin: 6px 0; }
.banner .review-note { margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: var(--surface); }
#save-banner.banner { max-width: 560px; margin: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 592px) { #save-banner.banner { margin-left: auto; margin-right: auto; } }
.meter { display: block; height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: inherit; background: var(--metal); transition: width 0.4s ease; }
.lv-bar { display: flex; height: 4px; border-radius: 999px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.lv-seg { display: block; min-width: 3px; }
.lv-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--line-2); }
.lv-new { background: var(--surface-3); }
.lv-learning { background: var(--lv1); }
.lv-reviewing { background: var(--lv2); }
.lv-settled { background: var(--metal); }
.lv-dot.lv-learning, .lv-dot.lv-reviewing, .lv-dot.lv-settled { border-color: transparent; }
.lv-dot.lv-off { background: transparent; border: 1px dashed var(--warn); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.stat { display: flex; flex-direction: column; gap: 3px; padding: 4px 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat-num { font-size: 1.6rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-num small { font-size: 0.85rem; color: var(--ink-3); font-weight: 500; }
.stat-label { font-size: 0.7rem; color: var(--ink-3); letter-spacing: 0.06em; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 0.84rem; color: var(--ink-3); letter-spacing: 0.04em; }
.counts b { font-size: 1.35rem; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; letter-spacing: 0; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.facts > div { display: flex; flex-direction: column; gap: 3px; }
.facts > div + div { border-left: 1px solid var(--line); }
.facts dt { font-size: 0.7rem; color: var(--ink-3); letter-spacing: 0.06em; }
.facts dd { font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.facts dd small { font-size: 0.76rem; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
details > summary { cursor: pointer; }
details.plain > summary { list-style: none; }
details.plain > summary::-webkit-details-marker { display: none; }

/* ---------- ホームの上（今日の記録） ---------- */
.hero {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: 122px 1fr; gap: 20px; align-items: center;
  padding: 22px 22px 22px 20px; border-radius: 26px;
  background: var(--graphite); color: var(--on-graphite);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), var(--shadow-2);
}
.hero::before {
  content: ""; position: absolute; inset: -60% -35% auto auto; width: 80%; height: 170%;
  background: radial-gradient(closest-side, rgba(143, 182, 221, 0.26), rgba(143, 182, 221, 0));
  pointer-events: none;
}
.hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--metal-soft); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.55; pointer-events: none; }
.hero-ring { position: relative; width: 122px; height: 122px; }
.hero-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring-track { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 9; }
.ring-fill { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.7s ease; }
.ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring-text b { font-size: 2.2rem; font-weight: 600; letter-spacing: -0.02em; }
.ring-text span { font-size: 0.74rem; color: var(--on-graphite-2); margin-top: 6px; letter-spacing: 0.06em; }
.hero-side { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hero-label { font-size: 0.74rem; letter-spacing: 0.16em; color: var(--on-graphite-2); display: flex; align-items: center; gap: 8px; }
.hero-done { padding: 1px 9px; border-radius: 999px; background: var(--metal); color: #0b131c; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; }
.hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero-stats div { display: flex; flex-direction: column; gap: 2px; }
.hero-stats dt { font-size: 0.7rem; color: var(--on-graphite-2); letter-spacing: 0.06em; }
.hero-stats dd { font-size: 1.6rem; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
.hero-stats dd small { font-size: 0.8rem; color: var(--on-graphite-2); margin-left: 2px; font-weight: 500; }
.hero-note { font-size: 0.72rem; color: var(--on-graphite-2); letter-spacing: 0.04em; }

/* ---------- 下のメニュー（浮いたバー） ---------- */
.bottom-nav {
  position: fixed; z-index: 20;
  left: 50%; transform: translateX(-50%);
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 28px));
  display: flex; gap: 2px; padding: 6px;
  border-radius: 24px;
  background: var(--glass);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-2);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  backdrop-filter: saturate(1.6) blur(18px);
}
.nav-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 52px; border-radius: 18px;
  color: var(--on-page); text-decoration: none; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.04em;
}
.nav-item .ic { width: 22px; height: 22px; }
.nav-item.is-current { color: var(--accent); background: var(--accent-soft); }

/* ---------- 学習（カード） ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px;
  margin: -6px -16px 0; padding: 8px 16px 10px;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
}
.topbar .icon-btn { box-shadow: none; }
.topbar .t-mid { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.topbar .t-label { font-size: 0.72rem; color: var(--on-page); font-weight: 500; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { height: 5px; border-radius: 999px; background: var(--line-2); overflow: hidden; box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.08); }
.progress > span { display: block; height: 100%; background: var(--metal); border-radius: inherit; transition: width 0.35s ease; }
.remain { font-size: 0.76rem; color: var(--on-page); white-space: nowrap; min-width: 54px; text-align: right; letter-spacing: 0.04em; }
.remain b { font-size: 1.15rem; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 1px; }

.card {
  position: relative;
  border-radius: 26px;
  border: 1.5px solid transparent;
  background: linear-gradient(180deg, var(--card-top) 0%, var(--surface) 55%) padding-box, var(--metal-line) border-box;
  box-shadow: var(--shadow-2);
  padding: 22px 22px 24px;
  display: flex; flex-direction: column; gap: 22px;
}
.card::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 38%;
  border-radius: 24px 24px 0 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 0%, var(--sheen), rgba(255, 255, 255, 0));
}
.card > * { position: relative; }
/* めくったときだけ、ふわっと出す（テストで語を並べるたびには動かさない） */
.card-front, .card-back { animation: card-in 0.22s ease-out; }
@keyframes card-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.card-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 22px; }
.card-meta .tag { font-size: 0.72rem; color: var(--ink-3); font-weight: 500; letter-spacing: 0.08em; }
.card-front { min-height: clamp(400px, 62vh, 560px); cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.front-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.headword { font-family: var(--font-en); font-weight: 500; font-size: clamp(3.2rem, 15vw, 4.5rem); line-height: 1.04; letter-spacing: -0.02em; overflow-wrap: anywhere; color: var(--ink); }
.headword.sm { font-size: clamp(2.2rem, 9.5vw, 2.7rem); }
.ipa { font-family: var(--font-ipa); color: var(--ink-3); font-size: 0.98rem; letter-spacing: 0.02em; }
.cue-line { display: inline-flex; align-items: center; gap: 12px; }
.cue { font-family: var(--font-en); font-size: 1.3rem; color: var(--ink-2); font-style: italic; }
.speak-note { font-size: 0.74rem; color: var(--ink-3); }
.tap-hint { text-align: center; font-size: 0.76rem; color: var(--ink-3); letter-spacing: 0.08em; }
.rev .front-body { gap: 14px; }
.rev-q { font-weight: 600; color: var(--accent); font-size: 0.92rem; letter-spacing: 0.06em; }
.cloze { display: flex; flex-direction: column; gap: 4px; padding: 13px 16px; background: var(--surface-2); border-radius: var(--r-sm); width: 100%; border: 1px solid var(--line); }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 2px solid var(--accent); color: transparent; line-height: 1.1; }
.hint { font-family: var(--font-en); font-size: 1.15rem; letter-spacing: 0.08em; color: var(--accent); }

/* 裏面 */
.back-head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.back-head .bh-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec { display: flex; flex-direction: column; gap: 7px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 18px; }
.sec-label { font-size: 0.7rem; font-weight: 600; color: var(--ink-3); letter-spacing: 0.14em; }
.nuance-text { font-size: 1.18rem; font-weight: 600; line-height: 1.65; color: var(--ink); font-feature-settings: "palt" 1; }
.rev .nuance-text { font-size: 1.05rem; }
.scene-art { display: flex; justify-content: center; }
.scene-art.has-dg { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; width: 100%; }
.scene-text { font-size: 0.97rem; color: var(--ink); line-height: 1.75; }
.meaning-text { font-size: 1.12rem; font-weight: 600; }
.role-line { font-size: 0.84rem; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.role-chip { display: inline-block; padding: 0 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 0.8rem; }
.role-pos { color: var(--ink-3); }
.ex { display: flex; flex-direction: column; gap: 7px; }
.ex + .ex { padding-top: 16px; }
.ex-en { font-family: var(--font-en); font-size: 1.22rem; line-height: 1.5; color: var(--ink); }
.ex-ja { font-size: 0.86rem; color: var(--ink-2); }
mark.hit { background: var(--hl); color: inherit; padding: 0 0.16em; border-radius: 5px; box-shadow: inset 0 -2px 0 var(--accent-2); }
details.more > summary {
  list-style: none; display: flex; align-items: center; justify-content: space-between;
  min-height: 50px; padding: 0 2px; color: var(--accent); font-weight: 600; font-size: 0.92rem; letter-spacing: 0.04em;
  border-top: 1px solid var(--line);
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: ""; width: 8px; height: 8px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(45deg); margin-right: 6px; transition: transform 0.2s ease; }
details.more[open] > summary::after { transform: rotate(-135deg); }
.more-body { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.sub h4 { font-size: 0.72rem; color: var(--ink-3); margin-bottom: 5px; font-weight: 600; letter-spacing: 0.12em; }
.sub p { font-size: 0.92rem; }
.contrast li { display: flex; flex-direction: column; padding: 10px 0; }
.contrast li + li { border-top: 1px solid var(--line); }
.contrast b { font-family: var(--font-en); font-size: 1.05rem; font-weight: 600; }
.contrast span { font-size: 0.9rem; color: var(--ink-2); }
.others li { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; padding: 3px 0; }
.pron { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.pron li { display: flex; gap: 8px; align-items: baseline; }
.mini-label { font-size: 0.7rem; font-weight: 600; color: var(--ink-3); letter-spacing: 0.06em; }
.stress-line { font-size: 0.86rem; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stress { display: inline-flex; gap: 4px; align-items: flex-end; font-family: var(--font-en); }
.syl { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; font-size: 1rem; color: var(--ink-3); }
.syl i { width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
.syl.strong { color: var(--ink); font-weight: 600; font-size: 1.12rem; }
.syl.strong i { width: 9px; height: 9px; background: var(--metal); }

/* 下のバー（学習・テスト） */
.answer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(0, 0, 0, 0), var(--glass) 28%);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.answer-bar > * { max-width: 560px; margin-left: auto; margin-right: auto; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-row .btn.primary { flex: 1; }
.rate-q { text-align: center; font-size: 0.74rem; font-weight: 500; color: var(--on-page); margin-bottom: 9px; letter-spacing: 0.1em; }
.rate-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.rate {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 66px; padding: 6px 4px;
  border-radius: 17px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink);
  box-shadow: var(--hi), var(--shadow-1);
  cursor: pointer; touch-action: manipulation;
  transition: transform 0.12s ease;
}
.rate:active { transform: scale(0.97); }
.rate-label { font-size: 0.86rem; font-weight: 600; line-height: 1.3; text-align: center; word-break: keep-all; overflow-wrap: anywhere; font-feature-settings: "palt" 1; }
.rate-next { font-size: 0.66rem; color: var(--ink-3); text-align: center; line-height: 1.3; letter-spacing: 0.02em; }
.r-good { background: var(--metal); background-size: 180% 180%; border-color: transparent; color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), var(--shadow-blue); text-shadow: 0 1px 1px rgba(0, 0, 0, 0.14); }
.r-good .rate-next { color: inherit; opacity: 0.78; }

/* 図 */
.dg { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
.dg .ln { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dg .ln2 { fill: none; stroke: var(--ink-3); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.dg .fl, .dg .fl.ln, .dg .fl.ln2 { fill: var(--surface); }
.dg .ac { fill: var(--accent); }
.dg .acs { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.dg .ink { fill: var(--ink-2); }
.dg .hl { fill: var(--accent-soft); stroke: var(--accent-2); stroke-width: 1.4; }
.dg .sky { fill: var(--sky); }
.dg .night { fill: var(--night); }
.dg .moon { fill: var(--moon); }
.dg .dash { stroke-dasharray: 4 5; }
.dg .frame { fill: var(--accent-soft); stroke: var(--accent-2); stroke-width: 1.1; }
.dg text { font-family: var(--font-ui); font-size: 12px; fill: var(--ink-2); }
.dg .te { font-family: var(--font-en); }
.dg .b { font-weight: 600; fill: var(--ink); font-size: 14px; }
.dg .s { font-size: 11px; }
.dg .big { font-size: 26px; }
.dg .on-ac { fill: var(--accent-ink); font-weight: 600; }
.dg .again-ln { stroke: var(--ng); stroke-width: 2; stroke-dasharray: 5 4; }

/* 達成のしるし */
.done-mark { width: 60px; height: 60px; margin: 0 auto; }
.done-mark circle { fill: none; stroke: var(--accent-2); stroke-width: 1.6; }
.done-mark path { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw 0.6s 0.15s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---------- 結果（カード） ---------- */
.result-hero { text-align: center; padding: 26px 0 0; display: flex; flex-direction: column; align-items: center; gap: 7px; }
#result-title { font-size: 1.55rem; outline: none; letter-spacing: 0.04em; }
.earned { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 0.02em; }
.goal-done { font-weight: 600; color: var(--accent); font-size: 0.84rem; letter-spacing: 0.06em; }
.result-list li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 13px 18px; position: relative; }
.result-list li + li::before { content: ""; position: absolute; top: 0; left: 18px; right: 0; height: 1px; background: var(--line); }
.rl-word { display: flex; flex-direction: column; min-width: 0; }
.rl-word b { font-family: var(--font-en); font-weight: 600; font-size: 1.06rem; }
.rl-word span { font-size: 0.79rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rl-next { font-size: 0.8rem; color: var(--ink-2); white-space: nowrap; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.rl-rate { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; }
.m-good { color: var(--accent); }
.m-hard { color: var(--warn); }
.m-again { color: var(--ng); }

<script>
/*
 * util.js — 日付・文字列などの小さな共通処理
 * ブラウザでは window.CIF.util、Node（テスト）では require() で使う。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.CIF = root.CIF || {};
    root.CIF.util = factory();
  }
})(this, function () {
  'use strict';

  const MINUTE = 60 * 1000;
  const DAY = 24 * 60 * MINUTE;

  /** その日の 0:00（端末のタイムゾーン）のタイムスタンプ */
  function startOfDay(ts) {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  /** ts の日の 0:00 から n 日後の 0:00（夏時間でもずれない） */
  function addDays(ts, n) {
    const d = new Date(startOfDay(ts));
    d.setDate(d.getDate() + n);
    return d.getTime();
  }

  /** 'YYYY-MM-DD'（端末のタイムゾーン） */
  function dayKey(ts) {
    const d = new Date(ts);
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  /** 'YYYY-MM-DD' → その日の 0:00 */
  function parseDayKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  }

  /** 2つの日付の「日数の差」（カレンダー上） */
  function daysBetween(fromTs, toTs) {
    return Math.round((startOfDay(toTs) - startOfDay(fromTs)) / DAY);
  }

  /** 復習予定を「今日」「明日」「3日後」「11/12」のように表す */
  function formatDue(due, now) {
    if (!due) return '未定';
    if (due <= now) return '今すぐ';
    const diffMin = Math.round((due - now) / MINUTE);
    if (startOfDay(due) === startOfDay(now)) {
      if (diffMin < 60) return diffMin + '分後';
      return '今日 ' + Math.round(diffMin / 60) + '時間後';
    }
    const days = daysBetween(now, due);
    if (days === 1) return '明日';
    if (days < 7) return days + '日後';
    const d = new Date(due);
    return (d.getMonth() + 1) + '/' + d.getDate() + '（' + days + '日後）';
  }

  /** 「11月4日」のような短い日付 */
  function formatDate(ts) {
    const d = new Date(ts);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function formatDateTime(ts) {
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
  }

  /** HTML に入れる文字列のエスケープ */
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /**
   * 例文の [ ] で囲んだ部分（その用法の単語）を取り出す。
   * "I'm [pretty] tired." → [{t:"I'm "}, {t:"pretty", hit:true}, {t:" tired."}]
   */
  function parseMarked(text) {
    const parts = [];
    const re = /\[([^\]]+)\]/g;
    let last = 0;
    let m;
    const s = String(text || '');
    while ((m = re.exec(s))) {
      if (m.index > last) parts.push({ t: s.slice(last, m.index) });
      parts.push({ t: m[1], hit: true });
      last = re.lastIndex;
    }
    if (last < s.length) parts.push({ t: s.slice(last) });
    return parts;
  }

  /** 読み上げ用に [ ] を外した文 */
  function plainSentence(text) {
    return String(text || '').replace(/\[([^\]]+)\]/g, '$1');
  }

  /** 例文の [ ] の部分を強調した HTML */
  function markedHtml(text) {
    return parseMarked(text)
      .map((p) => (p.hit ? '<mark class="hit">' + esc(p.t) + '</mark>' : esc(p.t)))
      .join('');
  }

  /** 例文の [ ] の部分を空欄にした HTML（場面→英語の練習用） */
  function clozeHtml(text) {
    return parseMarked(text)
      .map((p) => (p.hit ? '<span class="blank" aria-label="空欄">＿＿＿</span>' : esc(p.t)))
      .join('');
  }

  /** ID に使える短いランダム文字列 */
  function randomId(prefix) {
    const r = Math.random().toString(36).slice(2, 8);
    const t = Date.now().toString(36).slice(-4);
    return (prefix || 'id') + '-' + t + r;
  }

  /** 英単語から ID 用の文字列を作る */

<script>
/*
 * srs.js — 復習間隔（間隔反復）の計算
 *
 * 3段階の自己評価：
 *   again = 思い出せなかった → 10分後に再出題（セットの中でもすぐもう一度）
 *   hard  = あいまい         → 間隔を半分に（最短で翌日）
 *   good  = 思い出せた       → 間隔を広げる（1日 → 3日 → 約8日 → …）
 *
 * 1回答えられただけでは「定着」にしない。間隔が21日以上かつ
 * 3回続けて思い出せたときに、ようやく「定着してきた」と表示する。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('./util.js'));
  } else {
    root.CIF = root.CIF || {};
    root.CIF.srs = factory(root.CIF.util);
  }
})(this, function (util) {
  'use strict';

  const RATINGS = ['again', 'hard', 'good'];
  const RATING_LABEL = { again: '思い出せなかった', hard: 'あいまい', good: '思い出せた' };
  const AGAIN_DELAY = 10 * util.MINUTE;
  const MAX_INTERVAL = 365;
  const MIN_EASE = 1.3;
  const START_EASE = 2.5;
  const HISTORY_LIMIT = 40;

  function newState() {
    return { reps: 0, lapses: 0, streak: 0, interval: 0, ease: START_EASE, due: 0, last: 0, history: [] };
  }

  /** 次の間隔（日数）。0 は「同じ日のうちにもう一度」 */
  function nextInterval(state, rating, now) {
    const s = state || newState();
    if (rating === 'again') return 0;
    if (rating === 'hard') {
      if (s.interval < 1) return 1;
      return Math.max(1, Math.round(s.interval / 2));
    }
    // good
    if (isEarly(s, now)) return s.interval; // 予定より前の復習では間隔を伸ばさない
    if (s.interval < 1) return 1;
    if (s.interval === 1) return 3;
    return Math.min(MAX_INTERVAL, Math.max(s.interval + 1, Math.round(s.interval * s.ease)));
  }

  /** 復習予定日より前に解いているか（同じ日の再出題は除く） */
  function isEarly(state, now) {
    return !!state && state.interval >= 1 && state.due > now;
  }

  /**
   * そのセットで初めて答えたときの更新。
   * 返り値は新しい状態（元の state は変更しない）。
   */
  function review(state, rating, now) {
    if (!RATINGS.includes(rating)) throw new Error('unknown rating: ' + rating);
    const prev = state || newState();
    const s = util.clone(prev);
    s.history = Array.isArray(s.history) ? s.history : [];
    const early = isEarly(prev, now);
    const ivl = nextInterval(prev, rating, now);

    if (rating === 'again') {
      if (prev.reps > 0) s.lapses += 1;
      s.streak = 0;
      s.ease = Math.max(MIN_EASE, round2(s.ease - 0.2));
      s.interval = 0;
      s.due = now + AGAIN_DELAY;
    } else if (rating === 'hard') {
      s.ease = Math.max(MIN_EASE, round2(s.ease - 0.15));
      s.interval = ivl;
      s.due = util.addDays(now, ivl);
      if (early) s.due = Math.min(prev.due, s.due);
    } else {
      if (early) {
        // 予定は変えない（前倒しで当たっても間隔は伸ばさない）
        s.interval = prev.interval;
        s.due = prev.due;
      } else {
        s.streak += 1;
        s.interval = ivl;
        s.due = util.addDays(now, ivl);
      }
    }
    s.reps += 1;
    s.last = now;
    s.history.push({ t: now, r: rating, ivl: s.interval });
    if (s.history.length > HISTORY_LIMIT) s.history = s.history.slice(-HISTORY_LIMIT);
    return s;
  }

  /**
   * 同じセット内で再出題したときの記録。予定は変えず、履歴だけ残す。
   * （「あいまい」で再出題 → 「思い出せた」でも、間隔を2回伸ばさないため）
   */
  function recordRepeat(state, rating, now) {
    const s = util.clone(state || newState());
    s.history = Array.isArray(s.history) ? s.history : [];
    s.history.push({ t: now, r: rating, re: true });
    if (s.history.length > HISTORY_LIMIT) s.history = s.history.slice(-HISTORY_LIMIT);
    if (rating === 'again') {
      // 見直した直後でも思い出せない → 今日のうちにもう一度出す
      s.interval = 0;
      s.streak = 0;
      s.due = now + AGAIN_DELAY;
    }
    return s;
  }

  /** ボタンの下に出す「次はいつ」 */
  function previewLabel(state, rating, now) {
    if (rating === 'again') return '10分後';
    const s = state || newState();
    if (rating === 'good' && isEarly(s, now)) return '予定どおり';
    const ivl = nextInterval(s, rating, now);
    if (ivl === 1) return '明日';
    return ivl + '日後';
  }

  function isDue(state, now) {
    return !!state && state.reps > 0 && state.due <= now;
  }

  /** 習得度。「完全習得」とは言わない */
  const LEVELS = {
    new: { key: 'new', label: '未学習', order: 0 },
    learning: { key: 'learning', label: '覚えはじめ', order: 1 },
    reviewing: { key: 'reviewing', label: '復習中', order: 2 },
    settled: { key: 'settled', label: '定着してきた', order: 3 },
  };

  function level(state) {
    if (!state || !state.reps) return LEVELS.new;
    if (state.interval < 3) return LEVELS.learning;
    if (state.interval >= 21 && state.streak >= 3) return LEVELS.settled;
    return LEVELS.reviewing;
  }

  function round2(n) {
    return Math.round(n * 100) / 100;
  }

  return {
    RATINGS, RATING_LABEL, AGAIN_DELAY, LEVELS,
    newState, nextInterval, isEarly, review, recordRepeat, previewLabel, isDue, level,
  };
});

<script>
/*
 * session.js — 1セット（基本10枚）の組み立てと、回答ごとの進め方
 *
 * 出題の優先順：
 *   1. 復習予定日を過ぎたカード（遅れている順）
 *   2. まだ学習していないカード
 *   3. それでも足りなければ、復習予定が近いカード（前倒し）

 * あとで同じ問題（同じ用法・同じ部）に正解すると「克服」になるが、記録は消さない。
 */

  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('./util.js'), require('./session.js'));
  } else {

  }

  }

  function normText(s) {
    return String(s || '').toLowerCase().replace(/[’]/g, "'").replace(/[.?!]+$/, '').replace(/\s+/g, ' ').trim();
  }

  /* ---------- 問題を作る ---------- */

  function pick(list, n, r) {
    return util.shuffle(list, r).slice(0, n);
  }

  function meaningChoices(item, pool, r) {
    const correct = item.sense.meaning;
    const used = new Set([correct]);
    const out = [];
    // 同じ単語のほかの用法は、見分ける練習になるので1つ入れる
    item.word.senses.forEach((s) => {
      if (out.length < 1 && s.id !== item.sense.id && s.meaning && !used.has(s.meaning) && s.status !== 'needs_review') {
        out.push(s.meaning);
        used.add(s.meaning);
      }
    });
    const others = pool.filter((p) => p.sense.id !== item.sense.id && p.word.id !== item.word.id);
    const same = others.filter((p) => p.sense.pos === item.sense.pos);
    [pick(same, 12, r), pick(others, 12, r)].forEach((cands) => {
      cands.forEach((p) => {
        if (out.length < 3 && !used.has(p.sense.meaning)) {
          out.push(p.sense.meaning);
          used.add(p.sense.meaning);
        }
      });
    });
    return out;
  }

  function wordChoices(item, pool, r) {
    const used = new Set([item.word.headword.toLowerCase()]);
    const out = [];
    const others = pool.filter((p) => p.word.id !== item.word.id);
    const same = others.filter((p) => p.sense.pos === item.sense.pos);
    [pick(same, 12, r), pick(others, 12, r)].forEach((cands) => {
      cands.forEach((p) => {
        const h = p.word.headword;
        if (out.length < 3 && !used.has(h.toLowerCase())) {
          out.push(h);
          used.add(h.toLowerCase());
        }
      });
    });
    return out;
  }

  /** 空所問題に使える例文（[ ] の語が見出し語そのままのもの） */
  function clozeExample(item) {
    const head = item.word.headword.toLowerCase();
    return (item.sense.examples || []).find((ex) => {
      const hits = util.parseMarked(ex.en).filter((p) => p.hit);
      return hits.length === 1 && hits[0].t.toLowerCase() === head;
    }) || null;
  }

  function understandQuestion(item, index, attemptNo, pool, r) {
    const types = ['meaning'];
    if (item.sense.nuance || (item.sense.scene && item.sense.scene.text)) types.push('scene');
    const cz = clozeExample(item);
    if (cz) types.push('cloze');
    const qtype = types[(index + attemptNo) % types.length];
    let choices;
    let correct;
    const prompt = { headword: item.word.headword, cue: item.sense.cue, speak: item.sense.speak || item.word.headword, ipa: item.sense.ipa };
    if (qtype === 'meaning') {
      correct = item.sense.meaning;
      choices = meaningChoices(item, pool, r);
    } else {
      correct = item.word.headword;
      choices = wordChoices(item, pool, r);
      if (qtype === 'scene') {
        prompt.scene = (item.sense.scene && item.sense.scene.text) || '';
        prompt.nuance = item.sense.nuance;
        prompt.diagram = (item.sense.scene && item.sense.scene.diagram) || '';
        prompt.role = item.sense.role;
        prompt.pos = item.sense.pos;
      } else {
        prompt.exEn = cz.en;
        prompt.exJa = cz.ja;
      }
    }
    const all = util.shuffle(choices.concat([correct]), r);
    return {
      id: 'u-' + item.sense.id,
      part: 'understand',
      qtype,
      senseId: item.sense.id,
      wordId: item.word.id,
      prompt,
      choices: all,
      answer: all.indexOf(correct),
    };
  }

  function composeQuestion(item, r) {
    const t = testSentence(item.sense);
    if (!t) return null;
    const { tokens, end } = tokenize(t.en);
    if (tokens.length < 2) return null;
    let order = util.shuffle(tokens.map((_, i) => i), r);
    for (let k = 0; k < 5 && order.every((v, i) => v === i); k++) order = util.shuffle(order, r);
    if (order.every((v, i) => v === i)) order = order.slice(1).concat(order[0]);
    return {
      id: 'c-' + item.sense.id,
      part: 'compose',
      qtype: 'order',
      senseId: item.sense.id,
      wordId: item.word.id,
      prompt: { ja: t.ja, headword: item.word.headword, sentence: t.en },
      tokens,
      order,
      end,
      answers: [normText(tokens.join(' '))].concat((t.alts || []).map(normText)),
    };
  }

  /**
   * テスト1回分を作る。
   *   kind 'round'  … 回のテスト（内容理解 → 文章作成。それぞれ全用法）
   *   kind 'review' … 覚えていないリストの解き直し（まだ克服していない問題だけ）
   */
  function createAttempt(opts) {
    const now = opts.now || Date.now();
    const seed = hash((opts.roundId || 'review') + ':' + (opts.no || 0) + ':' + now);
    const r = rng(seed);
    const items = opts.items || [];
    const pool = opts.pool && opts.pool.length >= 4 ? opts.pool : items;
    const want = opts.only ? new Set(opts.only) : null; // 'senseId|part'
    const u = [];
    const c = [];
    items.forEach((item, i) => {
      if (!want || want.has(item.sense.id + '|understand')) u.push(understandQuestion(item, i, opts.no || 1, pool, r));
      if (!want || want.has(item.sense.id + '|compose')) {
        const q = composeQuestion(item, r);
        if (q) c.push(q);
      }
    });
    return {
      id: util.randomId('test'),
      kind: opts.kind === 'review' ? 'review' : 'round',
      roundId: opts.roundId || '',
      no: opts.no || 0,
      startedAt: now,
      updatedAt: now,
      questions: u.concat(c),
      index: 0,
      results: [],
    };
  }

  function current(attempt) {
    return attempt && attempt.questions[attempt.index] ? attempt.questions[attempt.index] : null;
  }

  function isDone(attempt) {
    return !attempt || attempt.index >= attempt.questions.length;
  }

  /** 回答を判定する（response: 4択は番号、並べ替えは語の番号の並び、null は「わからない」） */
  function judge(q, response) {
    if (q.part === 'understand') {
      const ok = response === q.answer;
      return { correct: ok, given: response == null ? '（わからない）' : q.choices[response] || '', expected: q.choices[q.answer] };
    }
    const built = Array.isArray(response) ? response.map((i) => q.tokens[i]).join(' ') : '';
    const ok = !!built && q.answers.includes(normText(built));
    return {
      correct: ok,
      given: built ? built + q.end : '（わからない）',
      expected: util.plainSentence(q.prompt.sentence),
    };
  }

  /**
   * 回答を記録する。attempt / tests は書き換えずに新しいものを返す。
   * 間違えた問題はすぐに覚えていないリストへ入れる（途中でやめても残る）。
   */
  function answer(tests, attempt, response, now) {
    const q = current(attempt);
    if (!q) throw new Error('no question');
    const res = judge(q, response);
    const a = util.clone(attempt);
    a.results.push({ qid: q.id, correct: res.correct, given: res.given });
    a.index += 1;
    a.updatedAt = now;
    const t = util.clone(tests);
    t.current = a;
    const key = q.senseId + '|' + q.part;
    const m = t.misses[key];
    if (!res.correct) {
      const e = m || { senseId: q.senseId, part: q.part, roundIds: [], count: 0, firstAt: now, lastAt: 0, solvedAt: 0, last: {} };
      e.count += 1;
      e.lastAt = now;
      e.solvedAt = 0;
      if (attempt.roundId && !e.roundIds.includes(attempt.roundId)) e.roundIds.push(attempt.roundId);
      e.last = { qtype: q.qtype, given: res.given, answer: res.expected };
      t.misses[key] = e;
    } else if (m && !m.solvedAt) {
      m.solvedAt = now;
    }
    return { tests: t, attempt: a, result: Object.assign({ question: q }, res) };
  }

  function partScore(correct, total) {
    return total ? Math.floor((PARTS.understand.points * correct) / total) : 0;
  }

  /** 終わったテストを集計して記録に残す */
  function finish(tests, attempt, now) {
    const t = util.clone(tests);
    const parts = { understand: { correct: 0, total: 0 }, compose: { correct: 0, total: 0 } };
    const wrongs = [];
    attempt.questions.forEach((q, i) => {
      const r = attempt.results[i];
      parts[q.part].total += 1;
      if (r && r.correct) parts[q.part].correct += 1;
      else {
        wrongs.push({
          senseId: q.senseId,
          part: q.part,
          qtype: q.qtype,
          given: r ? r.given : '（未回答）',
          answer: q.part === 'understand' ? q.choices[q.answer] : util.plainSentence(q.prompt.sentence),
        });
      }
    });
    const total = parts.understand.total + parts.compose.total;
    const correct = parts.understand.correct + parts.compose.correct;
    let score;
    if (total && correct === total) score = 100;
    else if (attempt.kind === 'round') score = partScore(parts.understand.correct, parts.understand.total) + partScore(parts.compose.correct, parts.compose.total);
    else score = total ? Math.floor((100 * correct) / total) : 0;
    const summary = {
      id: attempt.id,
      kind: attempt.kind,
      roundId: attempt.roundId,
      no: attempt.no,
      startedAt: attempt.startedAt,
      finishedAt: now,
      score,
      parts,
      wrongs,
    };
    t.attempts = t.attempts.concat([summary]);
    t.current = null;
    return { tests: t, summary };
  }

  /* ---------- 集計 ---------- */

  function roundAttempts(tests, roundId) {
    return ((tests && tests.attempts) || []).filter((a) => a.kind === 'round' && a.roundId === roundId).sort((a, b) => a.no - b.no);
  }

  function nextNo(tests, roundId) {
    const list = roundAttempts(tests, roundId);
    return list.length ? list[list.length - 1].no + 1 : 1;
  }

  /** 回の成績：受験回数・最高点・前回・何回目で満点か */
  function roundStats(tests, roundId) {
    const list = roundAttempts(tests, roundId);
    const perfect = list.find((a) => a.score === 100) || null;
    return {
      attempts: list,
      count: list.length,
      best: list.length ? Math.max.apply(null, list.map((a) => a.score)) : null,
      last: list.length ? list[list.length - 1] : null,
      perfectAt: perfect,
    };
  }

  /** 覚えていないリスト。status: 'open'（まだ）/'solved'（克服）/'all' */
  function missList(tests, opts) {
    const o = opts || {};
    return Object.keys((tests && tests.misses) || {})
      .map((k) => Object.assign({ key: k }, tests.misses[k]))
      .filter((e) => (o.status === 'solved' ? e.solvedAt : o.status === 'all' ? true : !e.solvedAt))
      .filter((e) => !o.roundId || e.roundIds.includes(o.roundId))
      .sort((a, b) => b.lastAt - a.lastAt);
  }

  function missCounts(tests) {
    const all = missList(tests, { status: 'all' });
    return { open: all.filter((e) => !e.solvedAt).length, solved: all.filter((e) => e.solvedAt).length, all: all.length };
  }

  /** 覚えていないリストの解き直しに使う、用法と部の組み合わせ */
  function openKeys(tests, roundId) {
    return missList(tests, { status: 'open', roundId }).map((e) => e.key);
  }

  return {
    PARTS, QTYPE, rng, hash, roundItems, testSentence, tokenize, normText,
    createAttempt, current, isDone, judge, answer, finish,
    roundAttempts, nextNo, roundStats, missList, missCounts, openKeys,
  };
});
